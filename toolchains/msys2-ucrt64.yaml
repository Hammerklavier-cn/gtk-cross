# Windows x86_64 原生工具链（MSYS2 ucrt64 环境）
# 用途：Windows 宿主上以 UCRT 运行时原生构建 win64 目标。
# 与 msys2-mingw64 的区别：链接 UCRT（ucrtbase.dll，Windows 10+ 自带）而非
# msvcrt.dll；工具链三元组相同（x86_64-w64-mingw32），宿主工具来自
# mingw-w64-ucrt-x86_64-* 系统包，产物安装到独立 sysroot（out/msys2-ucrt64）。
# 约定：所有构建命令经由 MSYS2 bash（MSYSTEM=UCRT64）执行，
#       PATH 中的子系统目录由 msystem 派生（UCRT64 → ucrt64/bin）。
name: msys2-ucrt64
host: windows
platform: win64
description: "MSYS2 ucrt64 native (x86_64-w64-mingw32, GCC 16, UCRT runtime)"
msys2_root: C:/msys64
msystem: UCRT64
host_triple: x86_64-w64-mingw32
# 构建工具（都应在 ucrt64 bash 的 PATH 中可找到）
tools:
  cc: gcc
  cxx: g++
  pkg_config: pkg-config
  meson: meson
  ninja: ninja
  cmake: cmake
  make: make
  perl: perl
# 在 bash 内执行的默认环境（所有构建共享）：sysroot bin 前置，隔离 pkg-config
env:
  PKG_CONFIG_LIBDIR: "$SYSROOT/lib/pkgconfig:$SYSROOT/share/pkgconfig"
  PKG_CONFIG_PATH: ""
