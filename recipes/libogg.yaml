name: libogg
version: 1.3.6
source:
  url: https://downloads.xiph.org/releases/ogg/libogg-1.3.6.tar.xz
# 上游同时提供 autotools 与 CMake；这里用 CMake（与 MSYS2 官方包一致，且
# CMake 侧会正确安装 ogg.pc，libvorbis 的 configure 靠它找 ogg）。
build: cmake
cmake:
  defines:
    BUILD_TESTING: "OFF"
    # 静态（项目默认）：被 gst-plugins-base 的 ogg/vorbis/opus 插件静态链入。
    # 这些插件是独立 DLL，各自内嵌一份 ogg 代码没有跨 DLL 语义问题（纯 C、
    # 无 GObject 类型/单例跨边界），故无需像 introspection 链那样保留动态。
    INSTALL_DOCS: "OFF"