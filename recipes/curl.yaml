name: curl
version: 8.21.0
source:
  url: https://github.com/curl/curl/releases/download/curl-8_21_0/curl-8.21.0.tar.gz
build: cmake
deps:
  - zlib
cmake:
  defines:
    # 静态化：只产出 libcurl.a（不生成 libcurl.dll）
    BUILD_SHARED_LIBS: "OFF"
    BUILD_CURL_EXE: "OFF"
    BUILD_TESTING: "OFF"
    BUILD_EXAMPLES: "OFF"
    CURL_USE_OPENSSL: "OFF"
    CURL_USE_LIBSSH2: "OFF"
    CURL_USE_LIBPSL: "OFF"
    CURL_BROTLI: "OFF"
    CURL_ZSTD: "OFF"
    CURL_DISABLE_LDAP: "ON"
    ENABLE_ARES: "OFF"
    ENABLE_IDN2: "OFF"
# TLS 后端按平台而不同：schannel 是 Windows 的 SSPI 实现，Linux 上不存在，那边
# 用自建的 OpenSSL（recipes/openssl.yaml）。base 里留 CURL_USE_OPENSSL=OFF 是
# "默认无后端"的保守姿态（Windows 靠它，未来新平台也不会意外链上 crypto），
# Linux 块把这个叶子值改成 ON。
targets:
  - for: [windows]
    cmake:
      defines:
        # schannel 后端避免 openssl/libssh2 大链
        CURL_USE_SCHANNEL: "ON"
  - for: [linux]
    deps:
      - openssl
    cmake:
      defines:
        # 不写 CURL_USE_SCHANNEL：CMakeLists.txt:735-736 的非 WIN32 分支直接
        # `set(CURL_USE_SCHANNEL OFF)`，那个 -D 在本平台根本没被读过。
        CURL_USE_OPENSSL: "ON"