name: freetype
version: 2.14.3
source:
  url: https://download.savannah.gnu.org/releases/freetype/freetype-2.14.3.tar.xz
  sha256: 36bc4f1cc413335368ee656c42afca65c5a3987e8768cc28cf11ba775e785a5f
  mirrors:
    # savannah 官方站长期过载（502 常见）；Debian 的 +dfsg 官方重打包仅移除
    # 少量非自由文档，目录名与构建等价，由 deb.debian.org CDN 提供回退
    - url: https://deb.debian.org/debian/pool/main/f/freetype/freetype_2.14.3+dfsg.orig.tar.xz
      sha256: dc1bec263a6fffa436029efe6428f601d6b1a0b800837508ee3e49bbab8f1006
build: cmake
# 动态：cairo 与 pango 都链接 freetype，静态化会让两者各持一份拷贝，
# 而 FT_Face 会跨二者边界传递（pango 建 face → cairo-ft 使用）。
# 注意不要在这里写 BUILD_SHARED_LIBS：该变量由 default_library 统一注入。
default_library: shared
deps:
  - zlib
cmake:
  defines:
    FT_DISABLE_BROTLI: "TRUE"
    FT_DISABLE_BZIP2: "TRUE"
    FT_DISABLE_HARFBUZZ: "TRUE"
    FT_DISABLE_PNG: "TRUE"
    FT_ENABLE_ZLIB: "TRUE"