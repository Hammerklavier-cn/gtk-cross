name: cairo
version: 1.18.4
source:
  # 上游 cairographics.org 不可达，用 Debian pool 的原味 orig tar 包
  url: https://deb.debian.org/debian/pool/main/c/cairo/cairo_1.18.4.orig.tar.xz
build: meson
# 动态：introspection 链（cairo-1.0.gir 引用 libcairo-gobject-2.dll）
default_library: shared
deps:
  - pixman
  - freetype
  - fontconfig
  - libpng
  # 依赖 glib-base 而非 glib：cairo-gobject 只需 gobject 库本身；若依赖 glib
  # 会形成 glib -> gobject-introspection -> cairo -> glib 环（GI 的测试/工具
  # 需要 cairo）
  - glib-base
meson:
  options:
    - -Dtests=disabled
    # 启用 FreeType/FontConfig 字体后端（Windows 上默认 auto→disabled）：
    # 产出 cairo-ft.pc，pango 的 fc 字体后端（PANGOCAIRO_BACKEND=fc）依赖它；
    # pango 测试参考度量基于 FreeType 栅格化路径（对齐 MSYS2 官方包）
    - -Dfontconfig=enabled
    - -Dfreetype=enabled
    # 注：cairo 的 DirectWrite/d2d1 字体后端整段在 Windows 分支里
    # （meson.build:500-536 的 cairo-win32* 之后），Linux 上不会被探测，
    # 因此无需（也不能）为它写 -Ddwrite。
# X 相关后端的开关按平台分块（base 只放平台中立项）：
#   xlib 分支要 pkg-config 的 x11 + xext + xrender（meson.build:348/349/390，
#          required 实参就是 get_option('xlib')，所以开了 xlib 就必须有 xrender）；
#   xcb  分支要 xcb + xcb-render（:412/:414），xcb-shm 在 :441 一并取；
#   xlib-xcb 是第三个独立 feature（默认 disabled），要 x11-xcb.pc，本 recipe
#          不动它——保持上游默认。
targets:
  # Windows 上没有 X 后端可言：这两个开关属 Windows 侧裁剪，原先写在 base 里。
  - for: [windows]
    meson:
      options:
        - -Dxlib=disabled
        - -Dxcb=disabled
        # 修复 pango/GTK 字体度量段错误（0xc0000005）：cairo 的 Win32 静态互斥体
        # （CRITICAL_SECTION）由 cairo_win32_tls_callback（.CRT$XLD）初始化，
        # GCC 分支的 DEFINE_TLS_CALLBACK 缺少 MSVC 分支 /INCLUDE:_tls_used 的
        # 等价物；bfd ld 不生成 PE TLS directory，回调不被调用，互斥体全零，
        # EnterCriticalSection 崩溃（cairo-win32-font.c 的 font_face 哈希表锁）。
        # 与 glib 的 TLS 修复同族，同式修复。
        - -Dc_link_args=-Wl,--undefined=_tls_used
  # Linux 上 GTK 的 x11 后端要 cairo-xlib 表面（gdk/meson.build 的 x11 分支
  # dependency('cairo-xlib')），所以放开 xlib/xcb，并把 X 栈列进 deps——deps
  # 决定拓扑顺序，meson 则在隔离的 PKG_CONFIG_LIBDIR 下命中 sysroot 里的 .pc。
  - for: [linux]
    deps:
      - libx11
      - libxext
      - libxrender
      - libxcb
    meson:
      options:
        - -Dxlib=enabled
        - -Dxcb=enabled