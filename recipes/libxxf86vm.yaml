name: libxxf86vm
version: 1.1.7
source:
  url: https://www.x.org/releases/individual/lib/libXxf86vm-1.1.7.tar.xz
build: autotools
# XFree86-VidModeExtension。Mesa 的 libGL(GLX) 硬性要它：实测
# src/glx/meson.build 里那句 dependencies 列了
# dep_libdrm, dep_glproto, dep_x11, dep_xext, dep_glvnd, **dep_xxf86vm**,
# dep_xshmfence（另一处还带 dep_x11_xcb），缺它时 configure 直接报
# src/meson.build:2356:22: ERROR: Dependency "xxf86vm" not found。
# 本包是双构建（configure 与 meson.build 都在），X 栈统一走 autotools。
autotools:
  env:
    ACLOCAL_PATH: $SYSROOT/share/aclocal
deps:
  - util-macros
  - xorgproto
  - libx11
  - libxext
test:
  enabled: false
