name: glib-base
version: 2.90.0
source:
  url: https://download.gnome.org/sources/glib/2.90/glib-2.90.0.tar.xz
  sha256: 17d15cac2af80a33271127408e0abc2748eb297c595c2a26409e81e14e7d1b8f
build: meson
# 动态：introspection 链（g-ir-scanner 需 DLL 导入库；typelib 运行期 dlopen）
default_library: shared
deps:
  - zlib
  - libffi
  - pcre2
  - libiconv
  - gettext
# 引导阶段（与 gvsbuild 的 glib-base/GLib 两段式同构）：先以 introspection=disabled
# 构建完整 glib，供 gobject-introspection 编译（g-ir-scanner 需要已安装的 glib）；
# 之后 glib recipe 再开 introspection 重建覆盖安装。同一 tarball，锁文件各记一条。
meson:
  options:
    - -Dtests=false
    - -Dgtk_doc=false
    - -Dintrospection=disabled
    - -Dselinux=disabled
    - -Dlibmount=disabled
    - -Ddtrace=disabled
    - -Dnls=enabled
    - -Dglib_debug=disabled
    - -Dlibelf=disabled
    - -Dsystemtap=disabled
    - -Dsysprof=disabled
    # 修复 "TLS callback not invoked"：GCC 分支的 G_DEFINE_TLS_CALLBACK 缺少
    # MSVC 分支的 /INCLUDE:_tls_used 等价物；GNU bfd ld 仅在 _tls_used 被引用时
    # 才生成 PE TLS directory 并收集 .CRT$XL* 回调。引导阶段的 DLL 即需生效
    # （gobject-introspection 的测试要加载它）。
    - -Dc_link_args=-Wl,--undefined=_tls_used
