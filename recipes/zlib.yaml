name: zlib
version: 1.3.2
source:
  url: https://github.com/madler/zlib/releases/download/v1.3.2/zlib-1.3.2.tar.gz
  sha256: bb329a0a2cd0274d05519d61c667c062e06990d72e125ee2dfa8de64f0119d16
build: cmake
cmake:
  defines:
    # zlib 用自己的开关名（不是 BUILD_SHARED_LIBS）：只产出 libz.a
    ZLIB_BUILD_SHARED: "OFF"
    ZLIB_BUILD_STATIC: "ON"
    # 只构建不跑测试（zlib 上游无 meson/ctest 套件接入）
    ZLIB_BUILD_TESTING: "OFF"
patches:
  # Windows 下上游把静态库命名为 libzs.a（zlib_static_suffix="s"），
  # 而 zlib.pc 与下游 find_package(ZLIB) 都按 -lz 查找；去掉该后缀使
  # 静态库名为 libz.a，链接名与 .pc 一致。
  - zlib-0001-drop-windows-static-suffix.patch
