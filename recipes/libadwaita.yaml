name: libadwaita
version: 1.9.3
source:
  url: https://download.gnome.org/sources/libadwaita/1.9/libadwaita-1.9.3.tar.xz
  sha256: fc59b37028fe0126308e7b805d2f6e4e80227080a1797715e5e6286b8111e723
build: meson
deps:
  - gtk
  - glib
  - graphene
  - pango
  - gobject-introspection
  - appstream
meson:
  options:
    - -Dtests=true
    - -Dintrospection=enabled
    - -Dgtk_doc=false
    - -Ddocumentation=false
    - -Dvapi=false
    - -Dexamples=false
test:
  enabled: true
  # 根因已查明，系测试环境问题而非产物缺陷：libadwaita 上游本不携带
  # gschema；此前 g_settings_schema_source_lookup: source != NULL 断言是因为
  # 构建经由登录 bash，/etc/profile.d/000-msys2.sh 导出的 XDG_DATA_DIRS 指向
  # MSYS2 前缀——Windows 下 glib 对非空 XDG_DATA_DIRS 排他使用并跳过
  # DLL/exe 相对 share 定位，schema source 整体为 NULL。已修复：toolchain
  # prelude 统一注入 XDG_DATA_DIRS=$SYSROOT/share。以下 67 项为修复前登记，
  # 待重建后重跑验证并收缩。
