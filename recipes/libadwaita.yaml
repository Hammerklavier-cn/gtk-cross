name: libadwaita
version: 1.10.0
source:
  url: https://download.gnome.org/sources/libadwaita/1.10/libadwaita-1.10.0.tar.xz
  sha256: b1bf56239269d101a6391ad4553c910eff9cc6170b803916405477ef60a66c84
build: meson
# 动态：introspection 链（Adw-1.gir）
default_library: shared
deps:
  - gtk
  - glib
  - graphene
  - pango
  # adw-about-dialog.c 直接 dependency('fribidi')，显式声明以免依赖
  # pango → fribidi 的传递顺序
  - fribidi
  - gobject-introspection
  # 1.10.0 起 upstream 把 appstream 换成 vendored 的 ministream
  # （tarball 内含 subprojects/ministream 完整源码，依赖以
  # install-profile=vendored-no-excludelibs + default_library=static 内置链接，
  # 不安装也不产出额外 DLL），故不再依赖 appstream recipe。
meson:
  options:
    - -Dtests=true
    - -Dintrospection=enabled
    # 1.10.0 已删除 gtk_doc 选项（传未知选项 meson 直接报错）
    - -Ddocumentation=false
    - -Dvapi=false
    - -Dexamples=false
test:
  enabled: true
  known_failures: []
# 按 target 覆盖（recipe.py 的 Recipe.for_target）。两个 target 的唯一差别是
# CRT：ucrt64 用 UCRT，mingw64 前缀用 msvcrt.dll。
#   GTK 的 gtk_test_init（gtk/gtktestutils.c，1.24 亦同）硬编码
#   `setlocale (LC_ALL, "en_US.UTF-8")`，失败即 g_warning；而 libadwaita 的
#   tests/meson.build 把 G_DEBUG 设为 "gc-friendly,fatal-warnings"，于是这条
#   warning 被提升为致命 → GLib g_abort() → Windows CRT 退出码 3。因为每个
#   测试都走 gtk_test_init，libadwaita 全套 68 项在 mingw64 上集体 ERROR。
# UCRT 认识 "en_US.UTF-8" 这个 POSIX 名，msvcrt 只认
# "English_United States.1252" 之类，故同一份代码在 ucrt64 上 68/68 通过。
# 证据（两侧均为实测，非推断）：
#   - 本轮 CI run 36272599547：mingw64 68/68 ERROR exit status 3，stderr 只
#     有一行 "Gtk-WARNING: Failed to set locale to en_US.UTF-8"；ucrt64 全过。
#   - objdump -p 原生核实 CRT 归属：out/msys2-mingw64/bin/libglib-2.0-0.dll
#     与 C:/msys64/mingw64/bin/python.exe 均链 msvcrt.dll；
#     C:/msys64/ucrt64/bin/python.exe 链 api-ms-win-crt-*（UCRT）。
#   - setlocale 探针（同一条命令，两个前缀）：ucrt64 → 'en_US.UTF-8' 成功；
#     mingw64 → 失败。
# 结论：msvcrt 的平台限制，非产物缺陷，故只在 mingw64 登记。测试照旧运行，
# 若日后 msvcrt 支持该 locale（或套装测试增减），框架仍会以
# tests-known-absent / tests-unexpected 报出来，不会静默。
targets:
  msys2-mingw64:
    test:
      known_failures:
        - libadwaita:test-about-dialog
        - libadwaita:test-about-window
        - libadwaita:test-accent-color
