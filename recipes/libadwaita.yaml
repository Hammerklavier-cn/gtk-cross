name: libadwaita
version: 1.9.3
source:
  url: https://download.gnome.org/sources/libadwaita/1.9/libadwaita-1.9.3.tar.xz
  sha256: fc59b37028fe0126308e7b805d2f6e4e80227080a1797715e5e6286b8111e723
build: meson
# 动态：introspection 链（Adw-1.gir）
default_library: shared
deps:
  - gtk
  - glib
  - graphene
  - pango
  - gobject-introspection
  - appstream
meson:
  options:
    - -Dtests=true
    - -Dintrospection=enabled
    - -Dgtk_doc=false
    - -Ddocumentation=false
    - -Dvapi=false
    - -Dexamples=false
patches:
  # src/stylesheet/meson.build 判 'base.css' 是否存在（该文件从不生成），
  # 导致 tarball 构建误走 sass 路径并拉入 sassc/libsass 子工程（多出
  # libsass DLL + sassc.exe）；改为判实际预生成的 gtk.css。
  - libadwaita-0001-stylesheet-tarball-css-check.patch
test:
  enabled: true
  # 2026-08-25 重跑实测：XDG_DATA_DIRS 注入修复后 68 项全部通过，
  # 原 67 项（schema source 为 NULL 所致）全部移出登记。