name: libxext
version: 1.3.7
source:
  url: https://www.x.org/releases/individual/lib/libXext-1.3.7.tar.xz
build: autotools
# X 扩展公共库（XShape/XSync/Xdbe/…）；libXi / libXrandr / libXinerama 与
# GTK 的 x11 后端都要它。
autotools:
  env:
    ACLOCAL_PATH: $SYSROOT/share/aclocal
deps:
  - util-macros
  - xorgproto
  - libx11
test:
  enabled: false
