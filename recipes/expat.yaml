name: expat
version: 2.8.3
source:
  url: https://github.com/libexpat/libexpat/releases/download/R_2_8_3/expat-2.8.3.tar.xz
build: cmake
cmake:
  defines:
    # 静态化：只产出 libexpat.a（不生成 libexpat-1.dll）
    EXPAT_SHARED_LIBS: "OFF"
    EXPAT_BUILD_EXAMPLES: "OFF"
    EXPAT_BUILD_DOCS: "OFF"
    EXPAT_BUILD_TOOLS: "OFF"
test:
  enabled: true