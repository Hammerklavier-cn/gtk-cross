name: spirv-tools
version: 1.4.357.0
source:
  url: https://github.com/KhronosGroup/SPIRV-Tools/archive/refs/tags/vulkan-sdk-1.4.357.0.tar.gz
build: cmake
deps:
  - spirv-headers
# tag 归档不含 git submodule，从已构建的 spirv-headers 源码树填充
submodules:
  external/spirv-headers: spirv-headers
cmake:
  defines:
    SPIRV_SKIP_TESTS: "ON"
    SPIRV_WERROR: "OFF"
    SPIRV_SKIP_EXECUTABLES: "ON"
patches:
  # SPIRV-Tools-shared 仅发行版打包需要；静态构建下不产出其 DLL
  # （glslang 链的是静态 SPIRV-Tools 目标）。
  - spirv-tools-0001-skip-shared-variant.patch