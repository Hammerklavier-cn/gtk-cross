name: libffi
version: 3.8.0
source:
  url: https://github.com/libffi/libffi/releases/download/v3.8.0/libffi-3.8.0.tar.gz
  sha256: 7da3e2d9a171eb0a038f592ecad3ff2bb2550f3496d87b3b29ad0cf4430c0db4
build: autotools
# 必须动态：libffi 的 ffi_type_* 是"按地址比较"的数据符号，而 glib(gobject)
# 与 gobject-introspection 两个 DLL 都会用它。静态化会让每个 DLL 各嵌一份
# 副本，跨 DLL 比较指针必然不等——girepository 的 callable-info 测试
# （cif.rtype == &ffi_type_sint）即因此失败。原版构建同样产出 libffi-8.dll。
default_library: shared
autotools:
  configure:
    - --disable-docs
# x86_64 GNU/Linux 上 libffi 会把库装到 $prefix/lib64 而不是 $prefix/lib：
# configure 里 `multi_os_directory=`$CC $CFLAGS -print-multi-os-directory``，
# 本机（Fedora 44）返回 `../lib64`，命中
# `../*) toolexeclibdir=$toolexeclibdir/$multi_os_directory` 这条分支。
# 而框架的 LDFLAGS / LIBRARY_PATH / PKG_CONFIG_LIBDIR 与 README 承诺的 sysroot
# 布局都只认一个 lib 目录（meson 侧统一传 --libdir=lib、cmake 传
# CMAKE_INSTALL_LIBDIR=lib）。上游正好提供了关掉它的开关，按平台门控传入。
# Windows（mingw/ucrt）上该探测返回 `.`，不触发这条分支，所以只给 linux 家族块。
targets:
  - for: [linux]
    autotools:
      configure:
        - --disable-multi-os-directory
