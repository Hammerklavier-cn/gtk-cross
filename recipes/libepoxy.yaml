name: libepoxy
version: 1.5.10
source:
  # github release 404；freedesktop GitLab 归档有登录墙，用 Debian pool orig 包
  url: https://deb.debian.org/debian/pool/main/libe/libepoxy/libepoxy_1.5.10.orig.tar.gz
build: meson
# EGL 的取法按平台分块（两平台的 EGL 供给者本来就不同，写在一起会误导）：
#   * Windows：EGL 头与 egl.pc 来自本项目自建的 egl-headers recipe（Khronos
#     EGL-Registry 源码），**不依赖 MSYS2 的 mingw-w64-egl-headers 包**；epoxy 的
#     meson 用 dependency('egl') 只取头（partial_dependency 要 compile_args），
#     链接期不拉真实 EGL 实现——它运行期自己 dlopen（Windows 上即 ANGLE 的
#     libEGL.dll）。而 sysroot 里没有任何 Windows 可用的 EGL 实现，所以 EGL
#     支持必须关（理由见下面 windows 块）。
#   * Linux：EGL 的头与库由本闭包自建的 **Mesa** 提供（-Degl=enabled），
#     所以这里依赖 mesa，不再需要 egl-headers。
deps: []
meson:
  options:
    - -Dtests=false
    - -Ddocs=false
targets:
  - for: [windows]
    deps:
      - egl-headers
    meson:
      options:
        # epoxy 默认在 Windows 上关 EGL（meson.build: enable_egl=='auto' 时
        # build_egl = host_system 不是 windows/darwin），这里显式写下这个决定。
        #
        # 2026-09-27 实测结论：**不能开**。开 -Degl=yes 后本机必然崩溃——本机
        # 没有任何 EGL 运行时（Windows 上即 ANGLE 的 libEGL.dll），而 epoxy 在
        # ENABLE_EGL 下会于 GL 上下文检查里无条件走 EGL 查询：
        #   epoxy_is_desktop_gl() -> epoxy_eglGetCurrentContext ->
        #   egl_provider_resolver -> epoxy_conservative_egl_version ->
        #   eglGetCurrentDisplay 的分发指针为 NULL -> 跳到 0x0 段错误
        # （gdb 实测栈，触发点是 GTK 的 WGL 路径 gdk_win32_gl_context_wgl_realize
        #  → epoxy_has_gl_extension；libadwaita-demo --smoke 退出码 139）。
        # 也就是说：EGL 支持一旦编入，就连"只用 WGL"的正常路径也会崩，
        # 必须同时提供运行期 libEGL 才能打开。
        # 要打开 Windows 侧 EGL 的现实路径是：(a) 往 sysroot 放一个 libEGL
        # 实现（ANGLE，需先验证能否用 mingw-gcc 构建），或 (b) 给 epoxy 打补丁
        # 让"EGL 库未加载时 EGL 查询安全返回"。
        - -Degl=no
  - for: [linux]
    deps:
      # Mesa 自建 EGL（libEGL.so + EGL/egl.h + egl.pc）。Linux 上 EGL **必须**
      # 打开，不是可选优化：GTK 的 x11 后端无条件用 EGL——
      # gdk/x11/gdkdisplay-x11.c:61 的 `#include <epoxy/egl.h>` 没有 #ifdef，
      # gdk/x11/meson.build:11 也无条件编译 gdkglcontext-egl.c。实测关掉时
      # gtk 编译直接报 `fatal error: epoxy/egl.h：没有那个文件或目录`。
      # 上游默认值本来就是 Linux 开（build_egl = host_system 不在
      # ['windows','darwin']），所以这里是"回到上游默认"，而 Windows 块才是裁剪。
      - mesa
    meson:
      options:
        - -Degl=yes