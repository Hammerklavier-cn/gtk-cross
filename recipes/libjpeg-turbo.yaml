name: libjpeg-turbo
version: 3.2.0
source:
  url: https://github.com/libjpeg-turbo/libjpeg-turbo/releases/download/3.2.0/libjpeg-turbo-3.2.0.tar.gz
build: cmake
cmake:
  defines:
    # 静态化：只产出 libjpeg.a（不生成 libjpeg-62.dll）
    ENABLE_SHARED: "OFF"
    ENABLE_STATIC: "ON"
    WITH_TURBOJPEG: "OFF"
    WITH_SIMD: "ON"
    WITH_TOOLS: "OFF"
    WITH_TESTING: "OFF"