name: libxrender
version: 0.9.12
source:
  url: https://www.x.org/releases/individual/lib/libXrender-0.9.12.tar.xz
build: autotools
# RENDER 扩展（带 alpha 的合成绘制）。cairo 的 xlib 表面与 GTK x11 后端直接调它，
# cairo 侧对应 `-Dxlib-xrender=enabled`。
autotools:
  env:
    ACLOCAL_PATH: $SYSROOT/share/aclocal
deps:
  - util-macros
  - xorgproto
  - libx11
test:
  enabled: false
