name: libfyaml
version: 1.0.0-beta2
source:
  url: https://github.com/pantoniou/libfyaml/releases/download/v1.0.0-beta2/libfyaml-1.0.0-beta2.tar.gz
build: cmake
cmake:
  defines:
    # 静态化：只产出 libfyaml.a（不生成 libfyaml.dll / fyaml.dll）
    BUILD_SHARED_LIBS: "OFF"
    # libfyaml 用 CMake 标准 BUILD_TESTING（测试依赖 check 框架 FetchContent 拉取）
    BUILD_TESTING: "OFF"