name: glib
version: 2.90.0
source:
  url: https://download.gnome.org/sources/glib/2.90/glib-2.90.0.tar.xz
  sha256: 17d15cac2af80a33271127408e0abc2748eb297c595c2a26409e81e14e7d1b8f
build: meson
# 动态：introspection 链（g-ir-scanner 需 DLL 导入库；typelib 运行期 dlopen）
default_library: shared
deps:
  - glib-base
  - gobject-introspection
meson:
  options:
    - -Dtests=true
    - -Dgtk_doc=false
    - -Dintrospection=enabled
    - -Dselinux=disabled
    - -Dlibmount=disabled
    - -Ddtrace=disabled
    - -Dnls=enabled
    - -Dglib_debug=disabled
    - -Dlibelf=disabled
    - -Dsystemtap=disabled
    - -Dsysprof=disabled
    # 修复 "TLS callback not invoked"：GCC 分支的 G_DEFINE_TLS_CALLBACK 缺少
    # MSVC 分支的 /INCLUDE:_tls_used 等价物；GNU bfd ld 仅在 _tls_used 被引用时
    # 才生成 PE TLS directory 并收集 .CRT$XL* 回调（修复后 306 项测试全过）。
    - -Dc_link_args=-Wl,--undefined=_tls_used
test:
  enabled: true
  # mkenums.py / codegen.py 原登记为"负载相关偶发"，2026-09-26 排查确证实为
  # 环境依赖的确定性失败：glib-mkenums / gdbus-codegen 是 Python 脚本，其
  # stderr 被 testprogramrunner.py 以严格 encoding="utf-8" 解码；未设
  # PYTHONUTF8 时子进程按本机代码页（cp936/GBK）编码非 ASCII 输出（如
  # gdbus-codegen 报错文案里的弯引号），父进程 _readerthread 抛
  # UnicodeDecodeError 后线程静默死亡 → info.stderr 为 None →
  # `info.stderr.strip()` AttributeError。
  # 修复：toolchain env 统一设 PYTHONUTF8=1（与上游 glib .gitlab-ci.yml 一致），
  # 已实测 306 项全过，两项移出 known_failures。
  known_failures: []
