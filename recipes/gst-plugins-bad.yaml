name: gst-plugins-bad
version: 1.28.7
source:
  url: https://gstreamer.freedesktop.org/src/gst-plugins-bad/gst-plugins-bad-1.28.7.tar.xz
build: meson
# 同 gstreamer/gst-plugins-base：插件是运行期加载的 DLL，库必须动态
default_library: shared
deps:
  - gstreamer
  - gst-plugins-base
  - glib
  # d3d11/d3d12 插件需要 dependency('DirectX-Headers')（>= 1.611）；本仓库
  # 已有该 recipe（gtk 的 gdk/win32 d3d12 纹理路径同样用它）
  - directx-headers
  # d3d11 与 d3d12 的 gst-libs 都还要 dependency('DirectXMath','directxmath')
  # （d3d11/meson.build:203、d3d12/meson.build:129）——头文件库，从源码构建，
  # 不依赖 MSYS2 的 mingw-w64-directxmath 包
  - directxmath
meson:
  options:
    # GTK 的 media-gstreamer 硬性依赖两个 .pc：
    #   gstreamer-play-1.0：gstplay 是 gst-libs/gst/play（另有 gstplayer）的
    #     常驻库——gst-libs/gst/meson.build 里是裸的 subdir('play')/
    #     subdir('player')，没有选项门控，所以只要本包能配置出 gst-libs 就有。
    #   gstreamer-d3d12-1.0：由 -Dd3d12 门控，必须显式开
    #     （auto_features=disabled 会把所有 value:'auto' 的特性关掉）。
    - -Dd3d12=enabled
    # D3D11 插件：给出一条 GPU 视频输出路径（d3d11videosink 等），
    # autovideosink 在 Windows 上会优先选它；也是后续若要开 DXVA 解码的入口。
    - -Dd3d11=enabled
    # 不要的东西（bad 的插件列表极长，auto_features=disabled 已把其余全关）
    - -Dtests=disabled
    - -Dexamples=disabled
    - -Ddoc=disabled
    - -Dintrospection=disabled
    - -Dauto_features=disabled
    # 上游默认即 disabled，显式写出来表示不引入 GPL 侧编解码
    - -Dgpl=disabled