name: pcre2
version: 10.49
source:
  url: https://github.com/PCRE2Project/pcre2/releases/download/pcre2-10.49/pcre2-10.49.tar.gz
build: cmake
cmake:
  defines:
    PCRE2_BUILD_PCRE2_16: "OFF"
    PCRE2_BUILD_PCRE2_32: "OFF"
    PCRE2_BUILD_PCRE2GREP: "OFF"
    PCRE2_BUILD_TESTS: "OFF"
    PCRE2_SUPPORT_JIT: "OFF"
    PCRE2_SUPPORT_UNICODE: "ON"
