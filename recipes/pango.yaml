name: pango
version: 1.58.2
source:
  url: https://download.gnome.org/sources/pango/1.58/pango-1.58.2.tar.xz
build: meson
deps:
  - glib
  - harfbuzz
  - fribidi
  - fontconfig
  - freetype
  - cairo
meson:
  options:
    - -Dgtk_doc=false
    - -Dintrospection=enabled
    - -Dman-pages=false
test:
  enabled: true
  # cairo TLS 修复（-Wl,--undefined=_tls_used）复验通过：原 0xc0000005 崩溃
  # 消失，test-ellipsize/testiter 2026-08-25 重跑实测转好、移出登记。
  # 剩余 5 项为非崩溃性失败（DirectWrite 栈下依旧，如实登记）：
  #  - test-font：缺 Cantarell 字体（couldn't load font "Cantarell" 回退 Sans），
  #    features-and-variants 断言 desc 不等
  #  - test-font-data：boxes 字体 hinted/unhinted 度量断言不等
  #  - test-bidi/test-break：TAP 提前终止（expected 8, got 4），emoji 彩色
  #    字体缺失（couldn't load font "emoji"）
  #  - test-pangocairo-threads：exit 1
  known_failures:
    - pango:test-bidi
    - pango:test-break
    - pango:test-pangocairo-threads
    - pango:test-font-data
    - pango:test-font
