name: libvpx
version: 1.17.0
source:
  # webmproject 自家的 downloads.webmproject.org 在本机不可达（curl 000），
  # 用 GitHub tag 归档（与 MSYS2 同版本 1.17.0）
  url: https://github.com/webmproject/libvpx/archive/refs/tags/v1.17.0.tar.gz
build: autotools
# 静态（项目默认，且这里是唯一可行形态）：libvpx 的 configure 对非 ELF 平台
# 只在 gnu 工具链下"警告后继续"，明确 --enable-shared 会 die
# （configure: process_detect → "--enable-shared only supported on ELF, OS/2,
# and Darwin for now"）。产物 libvpx.a 由 gst-plugins-good 的 vpx 插件静态链入。
autotools:
  # 手工 configure（见 gtkcross/engines.py 的 raw_configure 分支）：它不接受
  # autoconf 的 -C/--host/--build（process_common_cmdline 对未知参数直接
  # die_unknown），所以目标平台与库形态都在这里写全。
  raw_configure: true
  configure:
    # 目标三元组由平台决定，见下面 targets:（base 里不写，避免把 win64 带给 Linux）
    # 库形态：框架的自动注入在 raw 模式下不生效，故显式写全；两平台同值以保持
    # closure 形态一致（Linux 是 ELF，共享库其实可选）。
    - --disable-shared
    - --enable-static
    # 与 MSYS2 官方包对齐的编解码开关：VP8/VP9（含 high-bitdepth 与时间降噪，
    # 需 experimental 模式）+ 运行期 CPU 检测 + 后处理
    - --enable-vp8
    - --enable-vp9
    - --enable-vp9-highbitdepth
    - --enable-vp9-temporal-denoising
    - --enable-experimental
    - --enable-runtime-cpu-detect
    - --enable-postproc
    # 不要的东西
    - --disable-unit-tests
    - --disable-examples
    - --disable-docs
    - --disable-install-docs
    - --disable-install-srcs
# libvpx 的 --target=<arch>-<os>-<toolchain> 是它自己的命名约定（不是 autoconf
# 三元组）。Windows 侧必须显式给值；Linux 侧**故意不给**：build/make/configure.sh
# 的 process_common_toolchain 在缺少 --target 时用
# `gcctarget="${CHOST:-$(gcc -dumpmachine)}"` 推 tgt_isa/tgt_os，case 表里
# `*x86_64*|*amd64* → x86_64`、`aarch64* → arm64`、`*linux* → linux`，于是
# x86_64 宿主得到 x86_64-linux-gcc、aarch64 宿主得到 arm64-linux-gcc。
# 由宿主编译器决定 arch，正是本 target（linux-native）跨架构可复用的做法。
targets:
  - for: [windows]
    autotools:
      configure:
        - --target=x86_64-win64-gcc
        # 汇编器显式钉死，避免 auto 探测到别的（yasm 缺失时 auto 分支会 die：
        # build/make/configure.sh:1474-1484 依次试 nasm、yasm，都没有就报
        # "Neither yasm nor nasm have been found"）。
        # Linux 侧**不写这条**：那是 x86 专属分支，aarch64 的 AS 来自
        # `${CROSS}as`（同文件 749 行）即 gas，硬塞 nasm 会把 ARM 的 .s 语法交给
        # 错误的汇编器；x86_64 上 auto 同样会选到 nasm，与 Windows 取值一致，
        # 而缺 nasm/yasm 时是响亮失败而非静默降级。
        - --as=nasm
