name: libpng
version: 1.6.59
source:
  url: https://download.sourceforge.net/libpng/libpng-1.6.59.tar.xz
build: cmake
patches:
  # 上游测试段门控在 PNG_SHARED 上、测试程序硬链 png_shared；纯静态构建会
  # 静默跳过全部 37 项自带测试。补丁改为按实际变体链接。
  - libpng-0001-tests-against-static-library.patch
  # 跨平台补丁（见 patches/README.md「跨平台」）：GCC 16 + -O3 + AVX2 目标
  # （CI 的 x86-64-v3 变体）会把 pngvalid 的 cexcept setjmp/longjmp 错误处理
  # 编到运行期不稳——同一二进制约 30% 的运行（18/60）在 ntdll 长
  # 跳转解栈里 SIGSEGV（2026-10-31 CI 实拍：msys2-ucrt64 [x86-64-v3] job
  # 报 pngvalid-progressive-interlace-standard "(Failed)"，基线 job 全绿）。
  # 补丁仅对该测试源关闭循环向量化，库本体与 CFLAGS 不动。Linux 的 longjmp
  # 不经过 Windows 的栈解栈（RtlUnwind/异常目录），同构建 37/37 全过。
  - libpng-0002-pngvalid-drop-loop-vectorization.patch
deps:
  - zlib
cmake:
  defines:
    # 静态化：只产出 libpng.a（不生成 libpng16.dll）
    PNG_SHARED: "OFF"
    PNG_STATIC: "ON"
    PNG_EXECUTABLES: "OFF"
    PNG_TESTS: "ON"
test:
  enabled: true