name: directx-headers
version: 1.721.2
source:
  # github.com 在部分网络下不可达（git clone 会失败），但 codeload 可用；
  # 主源走 codeload，镜像为 github archive 形式。
  url: https://codeload.github.com/microsoft/DirectX-Headers/tar.gz/refs/tags/v1.721.2
  mirrors:
    - url: https://github.com/microsoft/DirectX-Headers/archive/refs/tags/v1.721.2.tar.gz
build: cmake
# 只属于 Windows：gdk/win32 的 d3d12 路径与 gst 的 d3d11/d3d12 需要。
platforms: [windows]
# 静态：纯头文件 + 两个小静态库（上游直接写 STATIC，不随 BUILD_SHARED_LIBS）
cmake:
  defines:
    DXHEADERS_INSTALL: "ON"
    DXHEADERS_BUILD_TEST: "OFF"
    DXHEADERS_BUILD_GOOGLE_TEST: "OFF"
    BUILD_TESTING: "OFF"
