# CI：Windows 宿主（MSYS2 两个目标档案）+ Linux 宿主（linux-native 两个架构容器）
# 的完整编译检查。
#
# 范围：msys2-ucrt64 / msys2-mingw64 在 windows-latest 上；linux-native 在
# ubuntu-24.04（x86_64）与 ubuntu-24.04-arm（aarch64）两个 runner 上。选固定
# 版本而非 ubuntu-latest：lts 镜像内容可预期，避免 latest 滚动升级悄悄改变
# 产物基线。linux-native
# 的名字里不带 arch——同一份 recipe/toolchain 定义服务两种架构，arch 由宿主
# 编译器决定（toolchains/linux-native.yaml 与 recipes/libvpx.yaml 里记了依据）。
#
# 说明：本框架的构建命令自己会 spawn `C:/msys64/usr/bin/bash.exe -lc`（见
# gtkcross/toolchain.py bash_argv()），并把工具链 PATH / MSYSTEM / SYSROOT /
# PKG_CONFIG_LIBDIR 等注入子 shell。而 toolchains/*.yaml 里 `msys2_root:
# C:/msys64` 是**硬编码**的，故 CI 必须让 MSYS2 落在 C:\msys64——见下面
# setup-msys2 步骤的 `release: false`。
#
# “完整编译”= 仓库内全部 recipe（不写死名字，从 `gtkcross list` 动态枚举，
# 新增 recipe 自动纳入）。跨平台的归属由 recipe 自己的 `platforms:` 声明，框架
# 在不匹配的 target 上直接跳过并打印名单——两个 job 都用全量枚举，工作流里不
# 维护排除名单（那份必然与 recipe 漂移）。9 个 recipe 声明了 test.enabled，
# 构建流程会在 install 后自动运行其自带测试并按 known_failures 判定——这是
# 本项目的既定验收标准，故“编译检查”隐含包含这些测试。
#
# 编译参数变体（发布需要基线 / x86-64-v3 / x86-64-v4 三份资产）：
#   * 基线      ：不设 CFLAGS/CXXFLAGS，构建 + 测试照常（矩阵里不带
#     variant 的条目）。
#   * x86-64-v3 ：`-march=x86-64-v3`（AVX2/BMI/FMA）经环境变量
#     CFLAGS/CXXFLAGS 透传，仍是原生构建；托管 runner 的 CPU 全部满足 v3，
#     故构建 + 测试照常。
#   * x86-64-v4 ：不能再走原生构建。`-march=x86-64-v4` 经全局 CFLAGS 会
#     同时作用于 Meson 的 native: true 生成器（fribidi 的 gen-*-tab、
#     glib-compile-resources 等），无 AVX-512 的 runner 执行它们会
#     STATUS_ILLEGAL_INSTRUCTION；`--no-introspection/--no-test-build` 管不到
#     这类构建期工具。故 Windows v4 复用 msys2-ucrt64、Linux v4 复用
#     linux-native（无专用 toolchain 文件），都加 `--force-cross` 并经
#     CFLAGS 传 -march：build machine 的生成器用 baseline，target 才带 v4。
#     cross 默认不执行目标测试，也不需要 AVX-512 探针。
#   变体只挂 x86_64 可跑的 target：Windows 侧 msys2-ucrt64、
#   Linux 侧 linux-native/x86_64；aarch64 没有 x86-64-vN 指令级别概念，不设变体。
#
# 发布：push `v*` tag（或手动 dispatch 并填 release_tag）时，完整 CI 通过后
# Windows 与 Linux job 会各自用 `gtkcross export` 把 sysroot 打成可重定位归档
# （Linux 按 x86_64/aarch64 分开），由末尾的 release job 创建/更新 GitHub
# Release。普通分支/PR 运行不导出。

name: CI

on:
  push:
    # 仓库默认分支是 main；master 一并监听以防分支改名/镜像场景
    branches: [main, master]
    # 只有 v* tag 进入发布路径；普通 tag 不触发
    tags: ['v*']
  pull_request:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "发布 tag（留空只跑 CI；填写后在构建成功时创建/更新 Release）"
        required: false
        default: ""
        type: string

# 发布 tag：tag push 用 tag 名，手动 dispatch 用输入；空值表示只跑 CI。
# 构建 job 用 env.RELEASE_TAG 决定是否导出/上传 sysroot 归档。
env:
  RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || github.event.inputs.release_tag || '' }}

# PR 上的重复推送取消旧运行；main 上的运行不取消（避免打断长构建）
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build:
    name: build (${{ matrix.target }}${{ matrix.variant }})
    runs-on: windows-latest
    # GitHub 单作业硬上限 360 分钟；全链干净构建在 4 核 runner 上约 1.5–3 h。
    # v4 cross 需要先编 baseline 的 native 工具前缀（msys2-ucrt64-tools，
    # 23 recipe），再编 v4 全链；所有 Windows job 统一留到 360 分钟，避免
    # 变体因额外工具链闭包撞上 330 分钟上限。
    timeout-minutes: 360
    strategy:
      # 各 target 互不依赖：一个失败不取消其他，便于一次看清全部状态
      fail-fast: false
      matrix:
        include:
          - target: msys2-ucrt64
            msystem: UCRT64
            mprefix: mingw-w64-ucrt-x86_64
            asset_name: gtk-cross-msys2-ucrt64
          - target: msys2-mingw64
            msystem: MINGW64
            mprefix: mingw-w64-x86_64
            asset_name: gtk-cross-msys2-mingw64
          # 编译参数变体（见文件头注释）。v3/v4 都复用 msys2-ucrt64：
          # v3 原生构建；v4 加 `--force-cross`，target 产物落到
          # out/msys2-ucrt64-cross，baseline 的 out/msys2-ucrt64 作为
          # build machine 工具前缀。发布资产名仍沿用
          # gtk-cross-msys2-ucrt64 + 变体后缀，消费者无需改名。
          - target: msys2-ucrt64
            msystem: UCRT64
            mprefix: mingw-w64-ucrt-x86_64
            variant: " [x86-64-v3]"
            cflags: "-march=x86-64-v3"
            asset_name: gtk-cross-msys2-ucrt64
            asset_suffix: "-x86-64-v3"
          - target: msys2-ucrt64
            msystem: UCRT64
            mprefix: mingw-w64-ucrt-x86_64
            variant: " [x86-64-v4]"
            cflags: "-march=x86-64-v4"
            cross: true
            asset_name: gtk-cross-msys2-ucrt64
            asset_suffix: "-x86-64-v4"

    env:
      # 与本项目 toolchain env 一致：Python 子进程强制 UTF-8 I/O。
      # 缺失时 glib 的 glib-mkenums / gdbus-codegen（Python 脚本）在非 UTF-8
      # 代码页下会让 testprogramrunner 的严格 utf-8 解码抛错，表现为
      # glib:mkenums.py / glib:codegen.py 无谓失败。
      PYTHONUTF8: "1"

    steps:
      # setup-msys2 文档记录的已知坑：本仓库没有 .gitattributes，而 runner 的
      # git 默认 core.autocrlf 会把文本文件（含 patches/*.patch）检出为 CRLF。
      # 实测 GNU patch 仍能应用（会打印 Stripping trailing CRs），但为与本地
      # 检出一致、不依赖该容错行为，按上游建议在 checkout 之前关闭自动换行。
      - name: 关闭 Git 自动换行（MSYS2 工具链已知坑）
        run: git config --global core.autocrlf input

      - name: 检出代码
        uses: actions/checkout@v4

      # 安装到默认 C:\msys64，与本项目 toolchains/*.yaml 的 msys2_root 一致。
      #
      # base-devel 的依赖是 `base binutils bison diffutils dos2unix flex make
      # patch`——注意它**不含 perl 与 git**，二者必须显式列出：
      #   * perl：工具链 tools.perl 声明并在 doctor 中检查，autotools/cmake
      #     的 configure 会实际调用（本机日志中有 `checking for perl` 与
      #     `/usr/bin/perl`，共 54 处）。
      #   * git：cmake 项目在 build 阶段探测 `Found Git`（本机日志确认），
      #     缺失时个别项目会退到不同代码路径、产物与本地不一致。
      # 其余包提供 cc/cxx、pkg-config、meson、ninja、cmake，以及构建期需要的
      # msgfmt（gettext-tools，glib 翻译）与 gperf，外加运行框架本身的 Python。
      # zstd 供发布 tag 时的 `gtkcross export` 压缩 .tar.zst 使用；普通 CI
      # 不导出，但把包装在同一处，避免发布路径依赖 runner 的偶然内容。
      - name: 安装 MSYS2 工具链
        uses: msys2/setup-msys2@v2
        with:
          msystem: ${{ matrix.msystem }}
          # 关键：release: false —— 复用 runner 镜像预装的 C:\msys64。
          #
          # setup-msys2 默认 release: true，会把 MSYS2 全新装到
          # $RUNNER_TEMP\msys64（即 D:\a\_temp\msys64）。但本项目
          # toolchains/*.yaml 里 msys2_root 是**硬编码的 C:/msys64**
          # （gtkcross/toolchain.py bash_argv() 直接拼
          # <msys2_root>/usr/bin/bash.exe），届时框架会去 spawn runner 预装的
          # 那只 bash，那里并没有我们在此安装的 meson/ninja/gcc，doctor 必然失败。
          # release: false 走的是 setup-msys2 的 `msysRootDir = C:\msys64` 分支，
          # update/install 均作用于该目录，与项目配置一致。
          # （不能用 location: C:\ 配合 release: true：那分支遇到已存在的
          #  C:\msys64 会直接 setFailed "already exists"。）
          release: false
          # 全量 pacman -Syu：避免半升级（-Sy 不带 -u）导致包依赖不一致
          update: true
          # 缓存 pacman 包，缩短后续运行
          cache: true
          # 注意：install 是折叠块标量（>-），块内的 `#` 不是注释而是字面内容，
          # 会被当作包名传给 pacman，故说明只能写在这里、不能写进块内。
          # itstool：appstream 的 meson setup 必需（src/data/meson.build 里
          # find_program('itstool') 未找到会直接 ERROR 中止）。base-devel 与
          # gettext-tools 都不含它——本机之所以从未暴露，是因为系统恰好装了
          # mingw-w64-{ucrt-x86_64,x86_64}-itstool。依赖 python + python-lxml，
          # 由本前缀包自动带出。
          install: >-
            base-devel
            zstd
            perl
            git
            ${{ matrix.mprefix }}-gcc
            ${{ matrix.mprefix }}-binutils
            ${{ matrix.mprefix }}-pkgconf
            ${{ matrix.mprefix }}-meson
            ${{ matrix.mprefix }}-nasm
            ${{ matrix.mprefix }}-ninja
            ${{ matrix.mprefix }}-cmake
            ${{ matrix.mprefix }}-gettext-tools
            ${{ matrix.mprefix }}-gperf
            ${{ matrix.mprefix }}-itstool
            ${{ matrix.mprefix }}-python
            ${{ matrix.mprefix }}-python-yaml
            ${{ matrix.mprefix }}-python-setuptools

      # 源码缓存：downloads/ 下的 tarball 由 versions.lock.yaml 锁定，
      # 锁定文件不变即可复用，省去每次数百 MB 重下载。
      - name: 缓存下载的源码包
        uses: actions/cache@v4
        with:
          path: downloads
          key: downloads-${{ matrix.target }}-${{ hashFiles('versions.lock.yaml') }}
          restore-keys: |
            downloads-${{ matrix.target }}-

      # v4 的 build machine 工具前缀：用 baseline ucrt64 编
      # glib-base/gdk-pixbuf/shared-mime-info/shaderc 的闭包（23 recipe），
      # 安装到 out/msys2-ucrt64（v4 target 走 out/msys2-ucrt64-cross，不冲突）。
      # 只提供 glib-compile-resources / gdk-pixbuf-query-loaders /
      # update-mime-database / glslc；不跑测试，也不进发布资产。
      - name: 构建 native 工具前缀（x86-64-v4 --force-cross 前置）
        if: matrix.cross
        shell: msys2 {0}
        run: |
          set -euo pipefail
          python -m gtkcross build glib-base gdk-pixbuf shared-mime-info shaderc \
            -t msys2-ucrt64 -j"$(nproc)" --no-test --no-test-build
          test -x out/msys2-ucrt64/bin/glib-compile-resources.exe
          test -x out/msys2-ucrt64/bin/gdk-pixbuf-query-loaders.exe
          test -x out/msys2-ucrt64/bin/update-mime-database.exe
          test -x out/msys2-ucrt64/bin/glslc.exe

      - name: 工具链自检（doctor）
        shell: msys2 {0}
        run: |
          set -euo pipefail
          doctor_args=()
          if [ "${{ matrix.cross }}" = "true" ]; then
            # 默认 build machine 工具前缀就是同 target 的 baseline
            # out/msys2-ucrt64（前面的工具步骤已编好）。
            doctor_args=(--force-cross)
          fi
          python --version
          python -m gtkcross doctor -t ${{ matrix.target }} "${doctor_args[@]}"

      # 计划快照与门控测试。这份 Windows 快照是本仓库在"开发机不是 Windows"时
      # 唯一的 Windows 回归护栏，反过来在 Windows runner 上跑一遍能确认快照
      # 与真实环境无关（capture_plan 只解析、不 spawn 进程）。
      - name: 单元与门控测试
        shell: msys2 {0}
        run: PYTHONPATH=. python -m unittest discover -s tests -v

      - name: 完整编译全部 recipe
        shell: msys2 {0}
        # v3 的编译参数经环境变量透传进框架（README「自定义编译参数」）。
        # v4 的 target flags 在 msys2-ucrt64-v4 工具链里（cross file），
        # 这里不再设置 CFLAGS；基线与 v4 的空字符串与未设置等价（环境指纹
        # 取 os.environ.get(k, '')、prelude 用 ${CFLAGS:+…}、cmake 注入判
        # 真值，三者对空串都不敏感）。
        env:
          CFLAGS: ${{ matrix.cflags }}
          CXXFLAGS: ${{ matrix.cflags }}
        run: |
          set -euo pipefail
          # 从 `list` 动态枚举全部 recipe（输出首行是表头，跳过）。
          # 注意进程替换 `<(...)` 的退出码会被忽略，故下面显式校验非空——
          # 否则枚举失效时会静默地“构建 0 个包”并通过，CI 形同虚设。
          mapfile -t NAMES < <(python -m gtkcross list | tail -n +2 | awk '{print $1}' | sort -u)
          if [ "${#NAMES[@]}" -eq 0 ]; then
            echo "::error::recipe 枚举为空，gtkcross list 可能失败或输出格式已变"
            exit 1
          fi
          echo "目标      : ${{ matrix.target }}"
          echo "变体      : ${{ matrix.variant || '(基线)' }}"
          echo "recipe 数 : ${#NAMES[@]}"
          echo "并行度    : $(nproc)"
          echo "磁盘      :"; df -h . | sed 's/^/  /'
          # v4 加 --force-cross：Builder 默认跳过测试执行、测试程序构建与
          # GIR；CFLAGS 只进 target 编译，native: true 生成器用 baseline。
          build_args=()
          if [ "${{ matrix.cross }}" = "true" ]; then
            build_args=(--force-cross)
          fi
          python -m gtkcross build "${NAMES[@]}" -t ${{ matrix.target }} \
            -j"$(nproc)" "${build_args[@]}"

      # 产物统计：本项目核心目标是尽量少产 DLL（静态优先），把计数打出来，
      # 便于在 CI 日志里一眼看出静态化是否回退。仅诊断，不参与判定。
      - name: sysroot 产物统计
        if: always()
        shell: msys2 {0}
        run: |
          if [ "${{ matrix.cross }}" = "true" ]; then
            root="out/${{ matrix.target }}-cross"
          else
            root="out/${{ matrix.target }}"
          fi
          echo "变体      : ${{ matrix.variant || '(基线)' }}"
          if [ -d "$root" ]; then
            echo "DLL: $(find "$root/bin" -name '*.dll' 2>/dev/null | wc -l)"
            echo ".a : $(find "$root/lib" -name '*.a'  2>/dev/null | wc -l)"
          else
            echo "sysroot 未生成：$root"
          fi

      # 仅在发布 tag 且前面全部成功时导出。`gtkcross export` 会把 .pc 的绝对
      # prefix 改写成 ${pcfiledir}/../..，并去掉符号链接里的构建机绝对路径；
      # 归档解包到任意目录后只需 PKG_CONFIG_LIBDIR 即可消费。
      # 普通分支/PR 不执行，避免每次 CI 都上传数百 MB 的 sysroot。
      - name: 导出可重定位 sysroot（仅发布 tag）
        if: success() && env.RELEASE_TAG != ''
        shell: msys2 {0}
        run: |
          set -euo pipefail
          tag="${RELEASE_TAG//\//-}"
          mkdir -p dist
          # 资产名带变体后缀（基线为空串 → 与旧行为逐字节一致）：
          # archive-root 与文件名都带，三份同类资产解包互不覆盖，artifact
          # 名也据此区分（release job 的下载 pattern 是 gtk-cross-sysroot-*）。
          # v4 用 --force-cross 导出 out/msys2-ucrt64-cross；消费者可见的归档
          # 仍叫 gtk-cross-msys2-ucrt64-x86-64-v4。
          out="dist/${{ matrix.asset_name }}${{ matrix.asset_suffix }}-${tag}.tar.zst"
          export_args=()
          if [ "${{ matrix.cross }}" = "true" ]; then
            export_args=(--force-cross)
          fi
          python -m gtkcross export -t ${{ matrix.target }} "${export_args[@]}" \
            --archive-root "${{ matrix.asset_name }}${{ matrix.asset_suffix }}" \
            -o "$out" --zstd-level 15
          ls -lh dist

      - name: 上传 sysroot 归档
        if: success() && env.RELEASE_TAG != ''
        uses: actions/upload-artifact@v4
        with:
          name: gtk-cross-sysroot-${{ matrix.target }}${{ matrix.asset_suffix }}
          path: dist/*.tar.zst
          if-no-files-found: error
          # 归档本身已是 zstd；artifact 再压一遍只浪费时间
          compression-level: 0
          retention-days: 7

      # 失败时收集测试诊断。框架对 unexpected 失败会把完整输出写到
      # <workdir>/test-failure.log，meson 另有 build/meson-logs/testlog.txt
      # （含每个测试的完整 command/env/tag）；两者都只在构建机磁盘上，
      # 不下载就无从查看。pango 的失败正是如此：日志里只有测试名，看不到
      # tag、实际字体与 fontconfig 状态，无法定位与本机的差异。
      # 这里把 fontconfig 关键事实直接打印到日志（无需下载即可读），并把
      # 上述文件收集到 ci-diagnostics/ 一起上传。continue-on-error 保证收集
      # 失败不会掩盖真正的构建错误。
      - name: 收集测试诊断（仅失败时）
        if: failure()
        shell: msys2 {0}
        continue-on-error: true
        run: |
          # 诊断步骤必须尽力收集，不能因单个探针失败就中止。msys2 的动作以
          # `bash -leo pipefail` 运行：set -e 加上 pipefail 会让 `ls` 一个不存在
          # 的文件（exit 2）终止整个步骤——首次运行正是如此，在 `ls
          # /etc/fonts/fonts.conf` 处就退出，导致最关键的两项（pango-list 字体数、
          # conf.d 状态）完全没有打印。故此处显式关闭 errexit，其余探针再用
          # `|| true` 兜底。
          set +e
          target="${{ matrix.target }}"
          if [ "${{ matrix.cross }}" = "true" ]; then
            build_target="$target-cross"
            sysroot="out/$target-cross"
          else
            build_target="$target"
            sysroot="out/$target"
          fi
          out="ci-diagnostics"
          rm -rf "$out"; mkdir -p "$out"

          # 1) 框架保存的完整测试输出
          find "build/$build_target" -name test-failure.log -type f 2>/dev/null | while read -r f; do
            name=$(echo "$f" | sed "s|^build/$build_target/||; s|/|__|g")
            cp "$f" "$out/$name" && echo "  [diag] 收集 $f"
          done

          # 2) meson 的 testlog（含每个测试的 command / env / 断言输出）
          find "build/$build_target" -path '*/meson-logs/testlog.txt' -type f 2>/dev/null | while read -r f; do
            recipe=$(echo "$f" | sed "s|^build/$build_target/||; s|/.*||")
            cp "$f" "$out/${recipe}__testlog.txt" && echo "  [diag] 收集 $f"
          done

          echo "===== fontconfig / pango 环境事实 ($build_target) ====="
          echo "MSYSTEM          : $MSYSTEM"
          echo "FONTCONFIG_FILE  : ${FONTCONFIG_FILE:-<unset>}"
          echo "FONTCONFIG_PATH  : ${FONTCONFIG_PATH:-<unset>}"
          echo "sysroot/etc/fonts/fonts.conf :"
          ls -la "$sysroot/etc/fonts/fonts.conf" 2>&1 | sed 's/^/    /'
          echo "MSYS2 根 /etc/fonts :"
          ls -la /etc/fonts/fonts.conf 2>&1 | sed 's/^/    /'
          echo "pango-list 可见字体数 :"
          if [ -x "$sysroot/bin/pango-list.exe" ]; then
            "$sysroot/bin/pango-list.exe" 2>&1 | wc -l | sed 's/^/    /'
          else
            echo "    (pango-list.exe 不存在)"
          fi

          # 判别力最强的一项。实测：pango 的 test-ellipsize / test-font-data
          # 失败与「字体数量」无关（conf.d 缺失时字体数仍为 908，照样失败），
          # 只与 fontconfig 是否成功加载 conf.d 里的规则有关——把 conf.d 整个
          # 移开即可在本机复现 CI 的精确签名（exit 3 / exit 1）。
          # 故这里按条目类型列出 conf.d：若符号链接在 CI 上创建失败、或
          # conf.d 为空，就会是根因；fontconfig-0001 补丁的复制回退是否生效
          # 也由此可直接看出。
          echo "sysroot conf.d 条目数 :"
          if [ -d "$sysroot/etc/fonts/conf.d" ]; then
            find "$sysroot/etc/fonts/conf.d" -mindepth 1 -maxdepth 1 | wc -l | sed 's/^/    /'
            echo "  前 5 项（链接 -> 目标 / 普通文件）:"
            ls -la "$sysroot/etc/fonts/conf.d" 2>&1 | sed -n '2,6p' | sed 's/^/    /'
          else
            echo "    (conf.d 不存在！)"
          fi
          echo "SystemRoot=$SYSTEMROOT  PWD=$PWD  (路径形式差异会影响 /etc/fonts 的解析)"

          # 最有判别力的一项：让 fontconfig 自报它实际加载了哪些配置。启用
          # FC_DEBUG=1024（FC_DBG_CONFIG）后，fontconfig 会打印 "Scanning config
          # dir <path>" 与每个 "Loading config file from <path>"；只要 conf.d 的
          # 默认片段出现在输出里，就说明规则已生效；反之是解析到了别处或该目录
          # 为空——这比推断可靠，也直接指向 fontconfig-0002 修的那个问题。
          #
          # 必须显式带上 PANGOCAIRO_BACKEND=fc 与 FONTCONFIG_FILE：pango 的测试
          # 环境是 recipe test.env + pango 自己的 test_env 拼出来的，不设
          # PANGOCAIRO_BACKEND 时 pango_cairo_font_map_new() 走默认 win32 后端，
          # fontconfig 根本不会初始化，FC_DEBUG 因而零输出（首次加此探针时正是
          # 漏了这两项，输出为空、毫无判别力）。
          echo "===== fontconfig 实际加载的配置 (FC_DEBUG=1024) ====="
          if [ -x "$sysroot/bin/pango-list.exe" ]; then
            PANGOCAIRO_BACKEND=fc \
            FONTCONFIG_FILE="$(cygpath -w "$sysroot/etc/fonts/fonts.conf" 2>/dev/null || echo "$sysroot/etc/fonts/fonts.conf")" \
            FC_DEBUG=1024 "$sysroot/bin/pango-list.exe" 2>&1 \
              | grep -aE "Scanning config dir|Loading config file from" \
              | sed 's/^/    /' | head -40 || true
          else
            echo "    (pango-list.exe 不存在)"
          fi

          # 3) 把失败测试行的摘要直接打到控制台
          echo "===== 失败测试摘要 ====="
          grep -rhE "^\s*[0-9]+/[0-9]+ .*(FAIL|ERROR)" "$out" 2>/dev/null | sed 's/^/  /' || true

      # 事件日志很小（约数十 KB）且记录了失败点/测试异常，失败时上传便于排查。
      # 构建立即输出到控制台，故不上传体积巨大的 gtkcross-build.log。
      - name: 上传事件日志与测试诊断（仅失败时）
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gtkcross-diagnostics-${{ matrix.target }}
          path: |
            gtkcross-events.log
            gtkcross-build.log
            ci-diagnostics
          if-no-files-found: ignore
          retention-days: 7

  # Linux 原生：同一份 linux-native 定义在**两种架构**的托管容器上各跑一遍。
  # target 名里不写 arch，所以这两个容器就是"架构无关"这句话的唯一证据；
  # 任一架构上的失败都说明有 arch 假设漏进了 recipe 或框架。
  linux:
    name: build (linux-native, ${{ matrix.arch }}${{ matrix.variant }})
    runs-on: ${{ matrix.runs_on }}
    # 干净构建全部 recipe（含 Mesa 与 gst-plugins-bad 两个大头）。比 Windows 的
    # 330 分钟短：原生编译没有跨 CRT/导入库的额外阶段，但源码下载与 Mesa 编译
    # 仍占不少时间，留足余量。
    timeout-minutes: 240
    strategy:
      # 两个架构互不依赖：一个失败不取消另一个，便于一次看清两边状态
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runs_on: ubuntu-24.04
          - arch: aarch64
            runs_on: ubuntu-24.04-arm
          # 编译参数变体（见文件头注释）。只挂 x86_64：x86-64-vN 是 x86
          # 指令级别，aarch64 的 gcc 不认这个 -march；aarch64 分支保持基线。
          # Linux 宿主有 cc，探针编译不依赖 MSYS2。
          - arch: x86_64
            runs_on: ubuntu-24.04
            variant: " [x86-64-v3]"
            cflags: "-march=x86-64-v3"
            asset_suffix: "-x86-64-v3"
          # x86-64-v4 不再在本 job 做 native 构建：GIR 生成会在构建期执行
          # AVX-512 dumper，托管 runner 的 CPU 不保证支持。改由下面的
          # linux-cross 矩阵用 linux-native --force-cross + CFLAGS 产出同名
          # 资产（与 Windows v4 同一机制）。

    env:
      # 无头容器没有 X。框架把 GTKCROSS_TEST_WRAPPER 作为整条测试命令的前缀
      # （gtkcross/engines.py 的 test_wrapper），gtk 的 1 项与 libadwaita 的 68 个
      # 测试程序才需要 DISPLAY。用前缀而不是 meson 的 --wrapper：后者按测试程序
      # 逐个包，libadwaita 会起 68 个 Xvfb；前缀在每次 test 调用外只起一个、被
      # 并发测试共用，而且 ctest 那条路径没有 --wrapper。
      # doctor 会检查该命令存在（gtkcross/toolchain.py），缺失时直接报出。
      # -s 会整体替换 xvfb-run 默认的 server args（即 -screen 0 640x480x24），
      # screen 规格必须一并写。-noreset：Xvfb 默认在最后一个 client 断开后
      # reset 重新初始化，meson -j4 下 68 个测试的波次间隙里若有新测试进程
      # 恰好连入，XOpenDisplay 会瞬时失败，gtk_init() 只 g_warning("Failed
      # to open display")（gtk/gtkmain.c），而上游测试环境 G_DEBUG=fatal-warnings
      # + g_test_init 无条件把 warning 设为致命 → abort()（SIGABRT）。
      # 实测命中一次：PR #3 run 41099243395 的 linux-native x86-64-v3 job，
      # libadwaita:test-shortcut-label 48/68 ERROR，同 run baseline/aarch64
      # 与 v3 job 前两轮均全过 —— 环境类瞬时问题，钉环境，不登记 known_failure。
      GTKCROSS_TEST_WRAPPER: xvfb-run -a -s "-screen 0 640x480x24 -noreset"

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      # 只装"宿主构建工具"。target 侧依赖一律从源码自建到 out/linux-native，
      # 所以这里**不得**出现任何 lib*-dev / *-devel：装了也不会被用到（框架把
      # PKG_CONFIG_LIBDIR 整体替换成 sysroot），却会掩盖 recipe 缺依赖的事实。
      # 名单按 Windows job 的 MSYS2 包一一对应，另加测试显示所需的 xvfb：
      #   build-essential  -> gcc/g++/make/patch（对应 *-gcc、base-devel）
      #   pkg-config       -> pkgconf（工具链 tools.pkg_config 的名字就是它）
      #   meson/ninja/cmake/make、autoconf/automake/libtool -> X.org 那批 autotools
      #     包（其 configure 运行期还要 $ACLOCAL_PATH 里的 util-macros，见
      #     recipes/platform-notes.md）
      #   perl             -> base-devel 不含它，Windows job 同理显式列出
      #   nasm             -> libvpx 在 x86_64 上的汇编器（Linux 侧由 auto 选出）
      #   gperf            -> glib
      #   gettext/itstool  -> msgfmt 与 ITS 规则合并（glib、shared-mime-info、appstream）
      #   python3-dev      -> gobject-introspection 要 Python.h（宿主构建工具类）
      #   python3-yaml     -> 本框架自身读 YAML，且 mesa 构建期也探测它
      #     （mesa-26.2.3/meson.build:1126 的 `import yaml` 任一解释器失败就
      #      continue，故它同时是 mesa 的宿主构建期依赖）
      #   python3-mako     -> mesa 的 Vulkan 代码生成器（vk_*_gen.py 全部
      #     `from mako.template import Template`）。上游的 debian 容器清单
      #     （.gitlab-ci/container/debian/x86_64_build-base.sh:72）把它列为
      #     构建期依赖；runner 镜像里**没有**它，缺了就是
      #     `src/meson.build:1140: ERROR: Python (3.x) mako module >= 0.8.0
      #     required to build mesa.`。注意 mesa 对每个候选解释器逐个探测
      #     （python3.16 … python3 … python），所以 apt 装到哪个版本都行。
      #     ⚠ 它同时是 gobject-introspection 那个**运行期测试**的开关，与下面的
      #     python3-markdown 必须成对：tests/scanner/test_docwriter.py:14 是
      #     `@unittest.skipUnless(HAS_MAKO, "mako missing")`，装上 mako 后该
      #     测试从"内部跳过（exit 0，meson 记 OK）"变成真的执行，而
      #     giscanner/docwriter.py:30 还有一句 `import markdown` ⇒ 只装 mako
      #     会得到 `ImportError: No module named 'markdown'`、exit 1、meson
      #     记 FAIL（本轮实测正是这个签名：65 项里 test_docwriter.py FAIL）。
      #     上游把两者放在一起装（.gitlab-ci/Dockerfile:43-44 的
      #     `python3-mako` + `python3-markdown`），不是巧合。
      #   python3-markdown -> 见上：g-i 的 docwriter 运行期 import。它本身不是
      #     任何测试的开关，所以单独装它不会改变测试集合；只有与 mako 配对时
      #     才有意义（mesa 那条走不到它——mesa 的 mako 只用于代码生成，
      #     不 import markdown）。
      #   python3-packaging -> 同一段探测里的第二个条件：探测脚本先
      #     `from packaging.version import Version`，失败才回退 distutils，
      #     而 Python 3.12+ 已移除 distutils ⇒ import 不到就 sys.exit(2) →
      #     `ERROR: One of Python (3.x) packaging or distutils module is
      #     required.`。本轮 arm64 的报错是 mako（exit 1）而非这条（exit 2），
      #     说明那个镜像恰好带了 packaging；但"恰好带"正是本项目 CI 名单要
      #     避免的隐式宿主依赖（上游 x86_64_build-base.sh 也是显式列出），
      #     故与 mako 一并显式声明。
      #   xz-utils         -> 解 .tar.xz 源包
      #   zstd             -> 发布 tag 时 gtkcross export 压缩 .tar.zst
      #   xvfb             -> 提供 xvfb-run（上面的 GTKCROSS_TEST_WRAPPER）
      #   fonts-cantarell  -> pango 的 test-font roundtrip small-caps/unicase
      #     需要 Cantarell 变体字体（上游 Linux CI 预装；runner 镜像默认只有
      #     fonts-noto-color-emoji）。
      #   fonts-noto-core  -> pango 的 test-font-data 断言值（approximate 宽度
      #     49273/58368）是上游用 fontconfig **默认 sans**（60-latin.conf 的
      #     prefer 首选 Noto Sans / DejaVu Sans）渲染 sample 串回退字符算出的
      #     均值。boxes.ttf 只覆盖 0x20 与 A–P/Z，sample 串的 36 个小写/空格
      #     字符全部回退宿主默认 sans；只装 Cantarell 时它成为默认 sans，而其
      #     空格宽度(22528)显著小于 Noto/DejaVu(26624)，均值漂到 46201 → 断言
      #     失败（本地用 Cantarell-only 字体集精确复现）。装 fonts-noto-core
      #     恢复上游基线的默认 sans，本地复现回归 49273/58368 ✓
      - name: 安装宿主构建工具
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            git \
            pkg-config \
            ninja-build cmake make \
            autoconf automake libtool \
            perl \
            nasm \
            gperf \
            bison flex \
            gettext itstool \
            python3 python3-dev python3-yaml \
            python3-mako python3-markdown python3-packaging \
            xz-utils \
            zstd \
            xvfb \
            fonts-cantarell \
            fonts-noto-core
          # apt 的 meson 在 ubuntu-24.04 上是 1.3.2，而 glib 2.90.0 要求
          # meson_version >= 1.4.0（glib-base 的 meson setup 直接 ERROR）。pipx
          # 装的是 PyPI 最新版；~/.local/bin 在 runner 的默认 PATH 里。
          # 注意不能与 apt 共装 meson：apt 的同版本号包会遮蔽 pipx 的入口。
          pipx install meson
          echo "meson       : $(meson --version)"
          echo "uname -m    : $(uname -m)"
          echo "gcc triple  : $(gcc -dumpmachine)"
          echo "nproc       : $(nproc)"

      - name: 缓存下载的源码包
        uses: actions/cache@v4
        with:
          path: downloads
          key: downloads-linux-native-${{ matrix.arch }}-${{ hashFiles('versions.lock.yaml') }}
          restore-keys: |
            downloads-linux-native-${{ matrix.arch }}-

      # 门控与计划快照测试。linux 侧的 ArchNeutralLinuxTarget 断言"任何 recipe 在
      # linux 家族下解析出的参数里没有 arch 字面量"，在这个 job 的 arm64 分支上
      # 与 x86_64 分支同样成立（它比对的是解析结果，不是宿主）。
      - name: 单元与门控测试
        run: PYTHONPATH=. python3 -m unittest discover -s tests -v

      - name: 工具链自检（doctor）
        run: |
          python3 --version
          PYTHONPATH=. python3 -m gtkcross doctor -t linux-native

      - name: 完整编译全部 recipe
        env:
          CFLAGS: ${{ matrix.cflags }}
          CXXFLAGS: ${{ matrix.cflags }}
        run: |
          set -euo pipefail
          # 与 Windows job 一样全量枚举：只属于 Windows 的包由框架按 recipe 的
          # platforms 声明跳过并打印名单（首行 [skip]），不在这里抄排除列表。
          mapfile -t NAMES < <(python3 -m gtkcross list | tail -n +2 | awk '{print $1}' | sort -u)
          if [ "${#NAMES[@]}" -eq 0 ]; then
            echo "::error::recipe 枚举为空，gtkcross list 可能失败或输出格式已变"
            exit 1
          fi
          echo "目标      : linux-native"
          echo "架构      : ${{ matrix.arch }}（uname -m = $(uname -m)）"
          echo "变体      : ${CFLAGS:-（基线，未设置）}"
          echo "recipe 数 : ${#NAMES[@]}"
          echo "磁盘      :"; df -h . | sed 's/^/  /'
          # x86-64-v4 不再在这条 native job 里构建（见 linux-cross）。
          PYTHONPATH=. python3 -m gtkcross build "${NAMES[@]}" -t linux-native -j"$(nproc)"

      # 产物统计 + 架构一致性。静态优先与"sysroot 只有一个 lib 目录"是本项目
      # 的形态约定；额外验证所有 .so 的 ELF Machine 都等于本 runner 的架构 ——
      # 这是 arm64 分支"没有混进 x86_64 产物"的直接证据。仅诊断，不参与判定。
      - name: sysroot 产物统计与架构一致性
        if: always()
        run: |
          root=out/linux-native
          [ -d "$root" ] || { echo "sysroot 未生成：$root"; exit 0; }
          echo ".a   : $(find "$root/lib" -name '*.a' | wc -l)"
          echo ".so  : $(find "$root/lib" -name '*.so*' -type f | wc -l)"
          echo "可执行: $(find "$root/bin" -type f | wc -l)"
          echo ".pc  : $(find "$root" -name '*.pc' | wc -l)"
          echo "typelib: $(find "$root" -name '*.typelib' | wc -l)"
          echo "dri 驱动: $(ls "$root/lib/dri" 2>/dev/null | tr '\n' ' ')"
          if [ -d "$root/lib64" ]; then
            echo "::error::出现 lib64/ 目录，sysroot 布局约定被破坏"; ls -la "$root/lib64"
          fi
          echo "===== ELF Machine 抽查（应全部等于本 runner 架构）====="
          for f in "$root"/lib/libglib-2.0.so* "$root"/lib/libGL.so* "$root"/bin/gtk4-broadwayd; do
            [ -f "$f" ] && readelf -h "$f" | sed -n 's/^  Machine: */&/p' | head -1
          done

      # Linux 原生 sysroot 也发布。target 名不带 arch，但资产必须带：同一个
      # tag 会在 x86_64 与 aarch64 两个 runner 上各产出一份，顶层目录也分开，
      # 否则解包到同一父目录会互相覆盖。
      - name: 导出可重定位 sysroot（仅发布 tag）
        if: success() && env.RELEASE_TAG != ''
        run: |
          set -euo pipefail
          tag="${RELEASE_TAG//\//-}"
          mkdir -p dist
          out="dist/gtk-cross-linux-native-${{ matrix.arch }}${{ matrix.asset_suffix }}-${tag}.tar.zst"
          PYTHONPATH=. python3 -m gtkcross export -t linux-native \
            --archive-root "gtk-cross-linux-native-${{ matrix.arch }}${{ matrix.asset_suffix }}" \
            -o "$out" --zstd-level 15
          ls -lh dist

      - name: 上传 sysroot 归档
        if: success() && env.RELEASE_TAG != ''
        uses: actions/upload-artifact@v4
        with:
          name: gtk-cross-sysroot-linux-native-${{ matrix.arch }}${{ matrix.asset_suffix }}
          path: dist/*.tar.zst
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

      - name: 收集测试诊断（仅失败时）
        if: failure()
        continue-on-error: true
        run: |
          set +e
          out=ci-diagnostics
          rm -rf "$out"; mkdir -p "$out"
          find build/linux-native -name test-failure.log -type f 2>/dev/null | while read -r f; do
            name=$(echo "$f" | sed "s|^build/linux-native/||; s|/|__|g")
            cp "$f" "$out/$name" && echo "  [diag] 收集 $f"
          done
          find build/linux-native -path '*/meson-logs/testlog.txt' -type f 2>/dev/null | while read -r f; do
            recipe=$(echo "$f" | sed "s|^build/linux-native/||; s|/.*||")
            cp "$f" "$out/${recipe}__testlog.txt" && echo "  [diag] 收集 $f"
          done
          echo "===== 环境事实 ====="
          echo "uname -m        : $(uname -m)"
          echo "gcc triple      : $(gcc -dumpmachine)"
          echo "DISPLAY         : ${DISPLAY:-<unset>}"
          echo "WRAPPER         : ${GTKCROSS_TEST_WRAPPER:-<unset>}"
          echo "xvfb-run        : $(command -v xvfb-run || echo 缺失)"
          echo "XDG_CONFIG_HOME : ${XDG_CONFIG_HOME:-<unset>}"
          echo "meson/ninja/cmake: $(meson --version) / $(ninja --version) / $(cmake --version | head -1)"
          echo "===== 失败测试摘要 ====="
          grep -rhE "^\s*[0-9]+/[0-9]+ .*(FAIL|ERROR)" "$out" 2>/dev/null | sed 's/^/  /' || true
          echo "===== 未完成的 recipe（stamp 缺失）====="
          for d in build/linux-native/*/; do
            [ -d "$d/done" ] || echo "  $(basename "$d")"
          done

      - name: 上传事件日志与测试诊断（仅失败时）
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gtkcross-diagnostics-linux-native-${{ matrix.arch }}
          path: |
            gtkcross-events.log
            gtkcross-build.log
            ci-diagnostics
          if-no-files-found: ignore
          retention-days: 7

  # cross 构建的 native 工具前缀。不是发布资产，只给下面的 cross job 用。
  # 只编工具链闭包（glib/gdk-pixbuf/shared-mime-info/shaderc），不跑测试。
  linux-tools:
    name: build native tools (linux x86_64)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装宿主构建工具
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential git pkg-config ninja-build cmake make \
            autoconf automake libtool perl nasm gperf bison flex gettext itstool \
            python3 python3-dev python3-yaml python3-mako python3-packaging \
            xz-utils zstd
          pipx install meson
          echo "meson    : $(meson --version)"
          echo "nproc    : $(nproc)"

      - name: 缓存下载的源码包
        uses: actions/cache@v4
        with:
          path: downloads
          key: downloads-linux-tools-${{ hashFiles('versions.lock.yaml') }}
          restore-keys: |
            downloads-linux-tools-

      - name: 单元与交叉计划测试
        run: PYTHONPATH=. python3 -m unittest discover -s tests -v

      - name: 构建 native 工具 sysroot
        run: |
          set -euo pipefail
          PYTHONPATH=. python3 -m gtkcross build \
            glib-base gdk-pixbuf shared-mime-info shaderc \
            -t linux-tools -j"$(nproc)" --no-test --no-test-build
          test -x out/linux-tools/bin/glib-compile-resources
          test -x out/linux-tools/bin/gdk-pixbuf-query-loaders
          test -x out/linux-tools/bin/update-mime-database
          test -x out/linux-tools/bin/glslc
          echo "native tools:"
          ls -1 out/linux-tools/bin | sed 's/^/  /'

      - name: 打包 native tools
        run: |
          set -euo pipefail
          mkdir -p dist
          tar -C out -cf - linux-tools | zstd -T0 -15 -f -o dist/linux-tools.tar.zst
          ls -lh dist/linux-tools.tar.zst

      - name: 上传 native tools
        uses: actions/upload-artifact@v4
        with:
          name: gtk-cross-tools-linux-x86_64
          path: dist/linux-tools.tar.zst
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  # Linux 宿主的三个 cross 目标。共同点：
  #   * native 工具来自 linux-tools；
  #   * Builder 默认关 GIR 与测试程序（cross 下目标码不能在构建机执行）；
  #   * 目标侧依赖仍全部自建，CMake/Meson/autotools 都走 cross 路径。
  linux-cross:
    name: cross (${{ matrix.label }})
    needs: linux-tools
    # mingw-w64 11 (Ubuntu 24.04) 缺 WinRT 头与 d2d1_3.h；26.04 的 13 才够
    # gst-plugins-bad d3d12 / GTK WinRT 探测。aarch64 target 也统一用这里。
    runs-on: ubuntu-26.04
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-mingw-x64
            label: linux-x64 -> windows-x64 (mingw64)
            apt: gcc-mingw-w64-x86-64 g++-mingw-w64-x86-64 binutils-mingw-w64-x86-64
            asset: gtk-cross-linux-mingw-x64
            archive_root: gtk-cross-linux-mingw-x64
          - target: linux-aarch64
            label: linux-x64 -> linux-aarch64
            apt: gcc-aarch64-linux-gnu g++-aarch64-linux-gnu binutils-aarch64-linux-gnu libc6-dev-arm64-cross
            asset: gtk-cross-linux-aarch64
            archive_root: gtk-cross-linux-aarch64
          # 与 Windows v4 同一机制：复用 linux-native，--force-cross 把它
          # 提升为同架构 cross（产物/中间态落 out/linux-native-cross，
          # native 工具来自 linux-tools），-march 只经 CFLAGS 进 target 编译。
          # 归档顶层仍是 gtk-cross-linux-native-x86_64-x86-64-v4：保持旧 v4
          # 资产名，消费者不需要改。
          - target: linux-native
            label: linux-x64 -> linux-x64-v4 (forced cross)
            variant: " [x86-64-v4]"
            cflags: "-march=x86-64-v4"
            cross: true
            apt: ""
            asset: gtk-cross-linux-native-x86_64-x86-64-v4
            archive_root: gtk-cross-linux-native-x86_64-x86-64-v4
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装宿主构建工具与交叉编译器
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential git pkg-config ninja-build cmake make \
            autoconf automake libtool perl nasm gperf bison flex gettext itstool \
            python3 python3-dev python3-yaml python3-mako python3-packaging \
            python3-markdown xz-utils zstd \
            ${{ matrix.apt }}
          pipx install meson
          echo "meson    : $(meson --version)"
          echo "uname -m : $(uname -m)"
          echo "target   : ${{ matrix.target }}"

      - name: 缓存下载的源码包
        uses: actions/cache@v4
        with:
          path: downloads
          key: downloads-cross-${{ matrix.target }}-${{ hashFiles('versions.lock.yaml') }}
          restore-keys: |
            downloads-cross-${{ matrix.target }}-

      - name: 下载 native tools
        uses: actions/download-artifact@v4
        with:
          name: gtk-cross-tools-linux-x86_64
          path: dist

      - name: 解包 native tools
        run: |
          set -euo pipefail
          mkdir -p out
          tar -C out -xf dist/linux-tools.tar.zst
          test -x out/linux-tools/bin/glib-compile-resources

      - name: 工具链自检（doctor）
        run: |
          set -euo pipefail
          # v4 条目加 --force-cross：doctor 看到的须是构建时同一个合成后
          # cross 工具链（同架构守卫、目标侧 -march 落地检查才有意义）。
          doctor_args=()
          if [ "${{ matrix.cross }}" = "true" ]; then
            doctor_args=(--force-cross)
          fi
          PYTHONPATH=. python3 -m gtkcross doctor -t ${{ matrix.target }} \
            "${doctor_args[@]}"

      - name: 完整交叉编译全部 recipe
        # v4 的编译参数经环境变量透传（与 Windows job 同一约定）：空串与
        # 未设置等价（环境指纹取 os.environ.get(k, '')、prelude 用
        # ${CFLAGS:+…}、cmake 注入判真值，三者对空串都不敏感）。
        env:
          CFLAGS: ${{ matrix.cflags }}
          CXXFLAGS: ${{ matrix.cflags }}
        run: |
          set -euo pipefail
          mapfile -t NAMES < <(python3 -m gtkcross list | tail -n +2 | awk '{print $1}' | sort -u)
          if [ "${#NAMES[@]}" -eq 0 ]; then
            echo "::error::recipe 枚举为空，gtkcross list 可能失败或输出格式已变"
            exit 1
          fi
          echo "目标      : ${{ matrix.target }}"
          echo "变体      : ${{ matrix.variant || '(基线)' }}"
          echo "recipe 数 : ${#NAMES[@]}"
          echo "磁盘      :"; df -h . | sed 's/^/  /'
          # v4 加 --force-cross：Builder 默认跳过测试执行、测试程序构建与
          # GIR；CFLAGS 只进 target 编译，cross prelude 不导出全局 CFLAGS，
          # 构建期生成器（native: true）不受影响。
          build_args=()
          if [ "${{ matrix.cross }}" = "true" ]; then
            build_args=(--force-cross)
          fi
          PYTHONPATH=. python3 -m gtkcross build "${NAMES[@]}" \
            -t ${{ matrix.target }} -j"$(nproc)" "${build_args[@]}"

      - name: 产物格式与架构检查
        if: always()
        run: |
          set +e
          # v4（cross）产物在 out/linux-native-cross，与 Windows job 同判据。
          if [ "${{ matrix.cross }}" = "true" ]; then
            root="out/${{ matrix.target }}-cross"
          else
            root="out/${{ matrix.target }}"
          fi
          [ -d "$root" ] || { echo "sysroot 未生成：$root"; exit 0; }
          echo ".a   : $(find "$root/lib" -name '*.a' | wc -l)"
          echo ".so  : $(find "$root/lib" -name '*.so*' -type f | wc -l)"
          echo ".dll* : $(find "$root" -name '*.dll' -o -name '*.dll.a' | wc -l)"
          echo ".pc  : $(find "$root" -name '*.pc' | wc -l)"
          echo "bin  : $(find "$root/bin" -type f | wc -l)"
          # 判别键：mingw/aarch64 按 target 名，v4 条目 target 已复用
          # linux-native，靠拼接 variant 区分。
          case "${{ matrix.target }}${{ matrix.variant }}" in
            linux-mingw-x64|linux-aarch64|*"x86-64-v4"*)
              f=$(find "$root/lib" -name 'libglib-2.0.so*' -type f | head -1)
              [ -n "$f" ] && readelf -h "$f" | sed -n 's/^  Machine: */&/p'
              ;;
          esac
          # v4 的 -march 唯一来源是本 job 的 CFLAGS env（与 Windows 相同）。
          # 漏设不会报错、只会静默产出 baseline ISA，这里断言它确实进了
          # target 编译参数——meson cross file 的 c_args 与 autotools
          # configure 前缀同源于 toolchain._target_cflags()。本步骤 set +e，
          # 失败必须显式 exit 1。
          if [ "${{ matrix.cross }}" = "true" ]; then
            if grep -Fq -- "-march=x86-64-v4" build/linux-native-cross/meson-cross.ini; then
              echo "-march 已进 target 编译参数（meson-cross.ini c_args）"
            else
              echo "::error::build/linux-native-cross/meson-cross.ini 未含 -march=x86-64-v4：CFLAGS 漏设，产物将退化为 baseline ISA"
              exit 1
            fi
          fi

      - name: 导出可重定位 sysroot（仅发布 tag）
        if: success() && env.RELEASE_TAG != ''
        run: |
          set -euo pipefail
          tag="${RELEASE_TAG//\//-}"
          mkdir -p dist
          # dist/ 里还有下载下来的 linux-tools.tar.zst；不要把它带进发布资产。
          rm -f dist/linux-tools.tar.zst
          out="dist/${{ matrix.asset }}-${tag}.tar.zst"
          # v4 必须带 --force-cross 导出 out/linux-native-cross；不带旗标会
          # 找 out/linux-native（本 job 不构建该目录）直接报错。
          export_args=()
          if [ "${{ matrix.cross }}" = "true" ]; then
            export_args=(--force-cross)
          fi
          PYTHONPATH=. python3 -m gtkcross export -t ${{ matrix.target }} \
            "${export_args[@]}" \
            --archive-root "${{ matrix.archive_root }}" \
            -o "$out" --zstd-level 15
          ls -lh dist

      - name: 上传 sysroot 归档
        if: success() && env.RELEASE_TAG != ''
        uses: actions/upload-artifact@v4
        with:
          name: gtk-cross-sysroot-${{ matrix.asset }}
          path: dist/${{ matrix.asset }}-*.tar.zst
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

      - name: 收集交叉构建诊断（仅失败时）
        if: failure()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: gtkcross-diagnostics-cross-${{ matrix.target }}
          path: |
            gtkcross-events.log
            gtkcross-build.log
          if-no-files-found: ignore
          retention-days: 7

  # 发布：Windows（基线 / v3 / v4）与 Linux（native 两架构 + cross）的
  # sysroot 都作为资产；发布说明里 required 列出的全部归档齐全才创建 Release。
  # Linux job 同时是同一份 recipe 定义的回归证据。
  release:
    name: publish sysroot release
    needs: [build, linux, linux-tools, linux-cross]
    if: success() && (startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && github.event.inputs.release_tag != ''))
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - name: 检出代码（versions.lock.yaml 与 tag 校验）
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: 下载 sysroot 归档
        uses: actions/download-artifact@v4
        with:
          pattern: gtk-cross-sysroot-*
          path: dist
          merge-multiple: true

      # 手动 dispatch 可以指定一个尚不存在的 tag（release 会在当前提交上创建
      # 它）；但如果 tag 已存在，必须与本次构建的提交一致，否则拒绝发布——
      # 否则会把分支 HEAD 的资产挂到另一个提交的 tag 上。
      - name: 校验 tag 指向本次构建提交
        env:
          TAG: ${{ env.RELEASE_TAG }}
        run: |
          set -euo pipefail
          ls -lh dist
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            tag_sha=$(git rev-parse "$TAG^{commit}")
            if [ "$tag_sha" != "$GITHUB_SHA" ]; then
              echo "::error::tag $TAG 指向 $tag_sha，与本次构建的 $GITHUB_SHA 不一致"
              exit 1
            fi
            echo "tag $TAG -> $tag_sha（与构建提交一致）"
          else
            echo "tag $TAG 尚不存在；release 将创建在当前提交 $GITHUB_SHA"
          fi

      - name: 生成发布说明与校验和
        env:
          TAG: ${{ env.RELEASE_TAG }}
        run: |
          set -euo pipefail
          # 资产清单随矩阵变体扩张（基线 / x86-64-v3 / x86-64-v4），完整性
          # 检查必须**逐份精确**验证：通配符会因"基线名是变体名的前缀"而漏检
          # （gtk-cross-msys2-ucrt64-* 匹配到 v3 就通过，基线缺失仍会被放过）。
          # tag 中的 '/' 在构建 job 导出时替换为 '-'（RELEASE_TAG//\//-），
          # 这里用同一规则构造精确文件名。mingw64 / aarch64 无指令级变体，
          # 只要求基线一份。
          tag="${TAG//\//-}"
          required=(
            "gtk-cross-msys2-mingw64-${tag}.tar.zst"
            "gtk-cross-msys2-ucrt64-${tag}.tar.zst"
            "gtk-cross-msys2-ucrt64-x86-64-v3-${tag}.tar.zst"
            "gtk-cross-msys2-ucrt64-x86-64-v4-${tag}.tar.zst"
            "gtk-cross-linux-native-x86_64-${tag}.tar.zst"
            "gtk-cross-linux-native-x86_64-x86-64-v3-${tag}.tar.zst"
            "gtk-cross-linux-native-x86_64-x86-64-v4-${tag}.tar.zst"
            "gtk-cross-linux-native-aarch64-${tag}.tar.zst"
            "gtk-cross-linux-mingw-x64-${tag}.tar.zst"
            "gtk-cross-linux-aarch64-${tag}.tar.zst"
          )
          for f in "${required[@]}"; do
            if [ ! -f "dist/$f" ]; then
              echo "::error::缺少 sysroot 归档：dist/$f"
              exit 1
            fi
          done
          echo "归档齐全：${#required[@]} 份（含基线 / x86-64-v3 / x86-64-v4 变体）"
          cp versions.lock.yaml dist/versions.lock.yaml
          (
            cd dist
            sha256sum *.tar.zst versions.lock.yaml > SHA256SUMS
            cat SHA256SUMS
          )
          {
            echo "gtk-cross sysroot $TAG"
            echo
            echo "- commit: \`$GITHUB_SHA\`"
            echo "- versions.lock.yaml sha256: \`$(sha256sum versions.lock.yaml | cut -d' ' -f1)\`"
            echo
            echo "## 资产"
            for f in dist/*.tar.zst; do
              echo "- \`$(basename "$f")\`"
            done
            echo
            cat .github/sysroot-release-notes.md
          } > release-notes.md
          cat release-notes.md

      - name: 创建或更新 Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ env.RELEASE_TAG }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --draft=false --notes-file release-notes.md
            gh release upload "$TAG" \
              dist/*.tar.zst dist/versions.lock.yaml dist/SHA256SUMS --clobber
          else
            # 已存在的 tag 不能再用 --target（gh 会拒绝/忽略）；只有手动
            # dispatch 指定新 tag 时才把它创建在当前提交上。
            target_args=()
            if ! git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
              target_args=(--target "$GITHUB_SHA")
            fi
            gh release create "$TAG" \
              --title "gtk-cross sysroot $TAG" \
              --notes-file release-notes.md \
              "${target_args[@]}" \
              dist/*.tar.zst dist/versions.lock.yaml dist/SHA256SUMS
          fi
