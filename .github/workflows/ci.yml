# CI：Windows 宿主、MSYS2 两个目标档案的完整编译检查。
#
# 范围（当前阶段）：只覆盖 msys2-ucrt64 / msys2-mingw64。其余目标（Linux
# 交叉等）待本机 Linux 环境验证完善后再补。
#
# 说明：本框架的构建命令自己会 spawn `C:/msys64/usr/bin/bash.exe -lc`（见
# gtkcross/toolchain.py bash_argv()），并把工具链 PATH / MSYSTEM / SYSROOT /
# PKG_CONFIG_LIBDIR 等注入子 shell。而 toolchains/*.yaml 里 `msys2_root:
# C:/msys64` 是**硬编码**的，故 CI 必须让 MSYS2 落在 C:\msys64——见下面
# setup-msys2 步骤的 `release: false`。
#
# “完整编译”= 仓库内全部 recipe（不写死名字，从 `gtkcross list` 动态枚举，
# 新增 recipe 自动纳入）。9 个 recipe 声明了 test.enabled，构建流程会在
# install 后自动运行其自带测试并按 known_failures 判定——这是本项目的既定
# 验收标准，故“编译检查”隐含包含这些测试。

name: CI

on:
  push:
    # 仓库默认分支是 main；master 一并监听以防分支改名/镜像场景
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

# PR 上的重复推送取消旧运行；main 上的运行不取消（避免打断长构建）
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build:
    name: build (${{ matrix.target }})
    runs-on: windows-latest
    # GitHub 单作业硬上限 360 分钟；全链干净构建在 4 核 runner 上约 1.5–3 h，
    # 留出余量但确保失败时能及时看到结果
    timeout-minutes: 330
    strategy:
      # 两个目标互不依赖：一个失败不取消另一个，便于一次看清两边状态
      fail-fast: false
      matrix:
        include:
          - target: msys2-ucrt64
            msystem: UCRT64
            mprefix: mingw-w64-ucrt-x86_64
          - target: msys2-mingw64
            msystem: MINGW64
            mprefix: mingw-w64-x86_64

    env:
      # 与本项目 toolchain env 一致：Python 子进程强制 UTF-8 I/O。
      # 缺失时 glib 的 glib-mkenums / gdbus-codegen（Python 脚本）在非 UTF-8
      # 代码页下会让 testprogramrunner 的严格 utf-8 解码抛错，表现为
      # glib:mkenums.py / glib:codegen.py 无谓失败。
      PYTHONUTF8: "1"

    steps:
      # setup-msys2 文档记录的已知坑：本仓库没有 .gitattributes，而 runner 的
      # git 默认 core.autocrlf 会把文本文件（含 patches/*.patch）检出为 CRLF。
      # 实测 GNU patch 仍能应用（会打印 Stripping trailing CRs），但为与本地
      # 检出一致、不依赖该容错行为，按上游建议在 checkout 之前关闭自动换行。
      - name: 关闭 Git 自动换行（MSYS2 工具链已知坑）
        run: git config --global core.autocrlf input

      - name: 检出代码
        uses: actions/checkout@v4

      # 安装到默认 C:\msys64，与本项目 toolchains/*.yaml 的 msys2_root 一致。
      #
      # base-devel 的依赖是 `base binutils bison diffutils dos2unix flex make
      # patch`——注意它**不含 perl 与 git**，二者必须显式列出：
      #   * perl：工具链 tools.perl 声明并在 doctor 中检查，autotools/cmake
      #     的 configure 会实际调用（本机日志中有 `checking for perl` 与
      #     `/usr/bin/perl`，共 54 处）。
      #   * git：cmake 项目在 build 阶段探测 `Found Git`（本机日志确认），
      #     缺失时个别项目会退到不同代码路径、产物与本地不一致。
      # 其余包提供 cc/cxx、pkg-config、meson、ninja、cmake，以及构建期需要的
      # msgfmt（gettext-tools，glib 翻译）与 gperf，外加运行框架本身的 Python。
      - name: 安装 MSYS2 工具链
        uses: msys2/setup-msys2@v2
        with:
          msystem: ${{ matrix.msystem }}
          # 关键：release: false —— 复用 runner 镜像预装的 C:\msys64。
          #
          # setup-msys2 默认 release: true，会把 MSYS2 全新装到
          # $RUNNER_TEMP\msys64（即 D:\a\_temp\msys64）。但本项目
          # toolchains/*.yaml 里 msys2_root 是**硬编码的 C:/msys64**
          # （gtkcross/toolchain.py bash_argv() 直接拼
          # <msys2_root>/usr/bin/bash.exe），届时框架会去 spawn runner 预装的
          # 那只 bash，那里并没有我们在此安装的 meson/ninja/gcc，doctor 必然失败。
          # release: false 走的是 setup-msys2 的 `msysRootDir = C:\msys64` 分支，
          # update/install 均作用于该目录，与项目配置一致。
          # （不能用 location: C:\ 配合 release: true：那分支遇到已存在的
          #  C:\msys64 会直接 setFailed "already exists"。）
          release: false
          # 全量 pacman -Syu：避免半升级（-Sy 不带 -u）导致包依赖不一致
          update: true
          # 缓存 pacman 包，缩短后续运行
          cache: true
          # 注意：install 是折叠块标量（>-），块内的 `#` 不是注释而是字面内容，
          # 会被当作包名传给 pacman，故说明只能写在这里、不能写进块内。
          # itstool：appstream 的 meson setup 必需（src/data/meson.build 里
          # find_program('itstool') 未找到会直接 ERROR 中止）。base-devel 与
          # gettext-tools 都不含它——本机之所以从未暴露，是因为系统恰好装了
          # mingw-w64-{ucrt-x86_64,x86_64}-itstool。依赖 python + python-lxml，
          # 由本前缀包自动带出。
          install: >-
            base-devel
            perl
            git
            ${{ matrix.mprefix }}-gcc
            ${{ matrix.mprefix }}-binutils
            ${{ matrix.mprefix }}-pkgconf
            ${{ matrix.mprefix }}-meson
            ${{ matrix.mprefix }}-ninja
            ${{ matrix.mprefix }}-cmake
            ${{ matrix.mprefix }}-gettext-tools
            ${{ matrix.mprefix }}-gperf
            ${{ matrix.mprefix }}-itstool
            ${{ matrix.mprefix }}-python
            ${{ matrix.mprefix }}-python-yaml
            ${{ matrix.mprefix }}-python-setuptools

      # 源码缓存：downloads/ 下的 tarball 由 versions.lock.yaml 锁定，
      # 锁定文件不变即可复用，省去每次数百 MB 重下载。
      - name: 缓存下载的源码包
        uses: actions/cache@v4
        with:
          path: downloads
          key: downloads-${{ matrix.target }}-${{ hashFiles('versions.lock.yaml') }}
          restore-keys: |
            downloads-${{ matrix.target }}-

      - name: 工具链自检（doctor）
        shell: msys2 {0}
        run: |
          python --version
          python -m gtkcross doctor -t ${{ matrix.target }}

      - name: 完整编译全部 recipe
        shell: msys2 {0}
        run: |
          set -euo pipefail
          # 从 `list` 动态枚举全部 recipe（输出首行是表头，跳过）。
          # 注意进程替换 `<(...)` 的退出码会被忽略，故下面显式校验非空——
          # 否则枚举失效时会静默地“构建 0 个包”并通过，CI 形同虚设。
          mapfile -t NAMES < <(python -m gtkcross list | tail -n +2 | awk '{print $1}' | sort -u)
          if [ "${#NAMES[@]}" -eq 0 ]; then
            echo "::error::recipe 枚举为空，gtkcross list 可能失败或输出格式已变"
            exit 1
          fi
          echo "目标      : ${{ matrix.target }}"
          echo "recipe 数 : ${#NAMES[@]}"
          echo "并行度    : $(nproc)"
          echo "磁盘      :"; df -h . | sed 's/^/  /'
          python -m gtkcross build "${NAMES[@]}" -t ${{ matrix.target }} -j"$(nproc)"

      # 产物统计：本项目核心目标是尽量少产 DLL（静态优先），把计数打出来，
      # 便于在 CI 日志里一眼看出静态化是否回退。仅诊断，不参与判定。
      - name: sysroot 产物统计
        if: always()
        shell: msys2 {0}
        run: |
          root="out/${{ matrix.target }}"
          if [ -d "$root" ]; then
            echo "DLL: $(find "$root/bin" -name '*.dll' 2>/dev/null | wc -l)"
            echo ".a : $(find "$root/lib" -name '*.a'  2>/dev/null | wc -l)"
          else
            echo "sysroot 未生成：$root"
          fi

      # 失败时收集测试诊断。框架对 unexpected 失败会把完整输出写到
      # <workdir>/test-failure.log，meson 另有 build/meson-logs/testlog.txt
      # （含每个测试的完整 command/env/tag）；两者都只在构建机磁盘上，
      # 不下载就无从查看。pango 的失败正是如此：日志里只有测试名，看不到
      # tag、实际字体与 fontconfig 状态，无法定位与本机的差异。
      # 这里把 fontconfig 关键事实直接打印到日志（无需下载即可读），并把
      # 上述文件收集到 ci-diagnostics/ 一起上传。continue-on-error 保证收集
      # 失败不会掩盖真正的构建错误。
      - name: 收集测试诊断（仅失败时）
        if: failure()
        shell: msys2 {0}
        continue-on-error: true
        run: |
          target="${{ matrix.target }}"
          out="ci-diagnostics"
          rm -rf "$out"; mkdir -p "$out"

          # 1) 框架保存的完整测试输出
          find "build/$target" -name test-failure.log -type f 2>/dev/null | while read -r f; do
            name=$(echo "$f" | sed "s|^build/$target/||; s|/|__|g")
            cp "$f" "$out/$name" && echo "  [diag] 收集 $f"
          done

          # 2) meson 的 testlog（含每个测试的 command / env / 断言输出）
          find "build/$target" -path '*/meson-logs/testlog.txt' -type f 2>/dev/null | while read -r f; do
            recipe=$(echo "$f" | sed "s|^build/$target/||; s|/.*||")
            cp "$f" "$out/${recipe}__testlog.txt" && echo "  [diag] 收集 $f"
          done

          echo "===== fontconfig / pango 环境事实 ($target) ====="
          echo "MSYSTEM          : $MSYSTEM"
          echo "FONTCONFIG_FILE  : ${FONTCONFIG_FILE:-<unset>}"
          echo "FONTCONFIG_PATH  : ${FONTCONFIG_PATH:-<unset>}"
          sysroot="out/$target"
          echo "sysroot/etc/fonts/fonts.conf :"
          ls -la "$sysroot/etc/fonts/fonts.conf" 2>&1 | sed 's/^/    /'
          echo "MSYS2 根 /etc/fonts :"
          ls -la /etc/fonts/fonts.conf 2>&1 | sed 's/^/    /'
          echo "pango-list 可见字体数 :"
          if [ -x "$sysroot/bin/pango-list.exe" ]; then
            "$sysroot/bin/pango-list.exe" 2>&1 | wc -l | sed 's/^/    /'
          else
            echo "    (pango-list.exe 不存在)"
          fi

          # 判别力最强的一项。实测：pango 的 test-ellipsize / test-font-data
          # 失败与「字体数量」无关（conf.d 缺失时字体数仍为 908，照样失败），
          # 只与 fontconfig 是否成功加载 conf.d 里的规则有关——把 conf.d 整个
          # 移开即可在本机复现 CI 的精确签名（exit 3 / exit 1）。
          # 故这里按条目类型列出 conf.d：若符号链接在 CI 上创建失败、或
          # conf.d 为空，就会是根因；fontconfig-0001 补丁的复制回退是否生效
          # 也由此可直接看出。
          echo "sysroot conf.d 条目数 :"
          if [ -d "$sysroot/etc/fonts/conf.d" ]; then
            find "$sysroot/etc/fonts/conf.d" -mindepth 1 -maxdepth 1 | wc -l | sed 's/^/    /'
            echo "  前 5 项（链接 -> 目标 / 普通文件）:"
            ls -la "$sysroot/etc/fonts/conf.d" 2>&1 | sed -n '2,6p' | sed 's/^/    /'
          else
            echo "    (conf.d 不存在！)"
          fi
          echo "SystemRoot=$SYSTEMROOT  PWD=$PWD  (路径形式差异会影响 /etc/fonts 的解析)"

          # 3) 把失败测试行的摘要直接打到控制台
          echo "===== 失败测试摘要 ====="
          grep -rhE "^\s*[0-9]+/[0-9]+ .*(FAIL|ERROR)" "$out" 2>/dev/null | sed 's/^/  /' || true

      # 事件日志很小（约数十 KB）且记录了失败点/测试异常，失败时上传便于排查。
      # 构建立即输出到控制台，故不上传体积巨大的 gtkcross-build.log。
      - name: 上传事件日志与测试诊断（仅失败时）
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gtkcross-diagnostics-${{ matrix.target }}
          path: |
            gtkcross-events.log
            ci-diagnostics
          if-no-files-found: ignore
          retention-days: 7
